name: Sync Profile Envelope v1.3 sources

on:
  push:
    branches:
      - main
      - production/supernatural-envelope-v1.3
    paths:
      - "project-map/galaxy.svg"
      - "assets/github-contributions-dark.svg"
      - "scripts/sync_profile_v13_sources.py"
      - ".github/workflows/sync-profile-envelope-v13.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-envelope-v13-source-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Sync source-authoritative SVGs into presentation only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_profile_v13_sources.py
          python scripts/sync_profile_v13_sources.py --repo .
          git diff --check

      - name: Verify source files were not rewritten
        shell: bash
        run: |
          set -euo pipefail
          git diff -- project-map/galaxy.svg assets/github-contributions-dark.svg > "$RUNNER_TEMP/source.diff"
          test ! -s "$RUNNER_TEMP/source.diff"
          grep -q 'font-size="9.2"' assets/profile-v12-projects.svg
          grep -q 'dur="360s"' assets/profile-v12-projects.svg
          ! grep -q 'PROJECT CONSTELLATION' assets/profile-v12-projects.svg
          ! grep -q 'ACTIVITY CURRENT' assets/profile-v12-activity.svg

      - name: Prove a future source update refreshes presentation without source rewrite
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/profile-v13-sync-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          cp -a scripts assets project-map "$probe/"
          python - "$probe/project-map/galaxy.svg" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path(sys.argv[1])
          root=ET.fromstring(path.read_text(encoding='utf-8'))
          ns=root.tag.split('}')[0].strip('{') if '}' in root.tag else ''
          tag=f'{{{ns}}}text' if ns else 'text'
          probe=ET.Element(tag, {'x':'8','y':'414','font-size':'7','data-v13-sync-probe':'true'})
          probe.text='PROFILE-V13-SYNC-PROBE'
          root.append(probe)
          path.write_text(ET.tostring(root,encoding='unicode')+'\n',encoding='utf-8')
          PY
          before="$(sha256sum "$probe/project-map/galaxy.svg" | cut -d' ' -f1)"
          python "$probe/scripts/sync_profile_v13_sources.py" --repo "$probe"
          after="$(sha256sum "$probe/project-map/galaxy.svg" | cut -d' ' -f1)"
          test "$before" = "$after"
          grep -q 'PROFILE-V13-SYNC-PROBE' "$probe/assets/profile-v12-projects.svg"
          grep -q 'font-size="7"' "$probe/assets/profile-v12-projects.svg"
          echo PROFILE_ENVELOPE_V13_WORKFLOW_COMPATIBILITY_PASS

      - name: Commit presentation refresh
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-v12-projects.svg assets/profile-v12-activity.svg
          if git diff --cached --quiet; then
            echo "Profile presentation already matches current source SVGs."
            exit 0
          fi
          git commit -m "sync profile envelope v1.3 sources"
          git push
