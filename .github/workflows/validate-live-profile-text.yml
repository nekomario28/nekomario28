name: Validate live profile text fallback

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-live-profile-text.yml"
      - "README.md"
      - "assets/profile-v12-top.svg"
      - "assets/profile-v16-overlay-00.svg"
      - "assets/github-contributions-dark.svg"
      - "project-map/galaxy.svg"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-live-profile-text.yml"
      - "README.md"
      - "assets/profile-v12-top.svg"
      - "assets/profile-v16-overlay-00.svg"
      - "assets/github-contributions-dark.svg"
      - "project-map/galaxy.svg"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate v1.4 mounted SVG font and single-surface portal contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          EXPECTED = "system-ui,-apple-system,BlinkMacSystemFont,SegoeUI,sans-serif"
          PORTAL_MEDIA = "https://konosuba.com/bakuen/story/img/pdsfi4/05.jpg"

          def normalized(value: str | None) -> str:
              return re.sub(r"\s+", "", (value or "").replace('"', "").replace("'", ""))

          def local_name(tag: str) -> str:
              return tag.rsplit("}", 1)[-1]

          readme = Path("README.md").read_text(encoding="utf-8")
          assert "<!-- profile-envelope-adapter:v1 -->" in readme, "v1.4 profile authority marker changed"
          mounted = (
              "assets/profile-v12-top.svg",
              "project-map/galaxy.svg",
              "assets/profile-v16-overlay-00.svg",
          )
          for path in mounted:
              assert f'src="{path}"' in readme, f"README no longer mounts {path}"
              ET.parse(path)

          portal_rows = [line for line in readme.splitlines() if PORTAL_MEDIA in line]
          assert len(portal_rows) == 1, "portal must be exactly one README surface"
          portal_row = portal_rows[0]
          assert f'src="{PORTAL_MEDIA}"' in portal_row, "direct remote portal media reference missing"
          assert 'width="900"' in portal_row and 'height="507"' in portal_row, "full-width portal geometry drifted"
          assert 'profile-v12-portal-left.svg' not in readme, "legacy left portal rail must not be mounted"
          assert 'profile-v12-portal-right.svg' not in readme, "legacy right portal rail must not be mounted"
          assert 'src="assets/profile-v13-portal.svg"' not in readme, "nested-remote combined portal must remain retired"
          assert not Path("assets/profile-v13-portal.svg").exists(), "retired combined portal asset unexpectedly present"

          top_root = ET.parse(mounted[0]).getroot()
          assert normalized(top_root.attrib.get("font-family")) == EXPECTED, "v1.4 top font family drifted"

          map_root = ET.parse(mounted[1]).getroot()
          assert normalized(map_root.attrib.get("font-family")) == EXPECTED, "Project Map root font family drifted"
          assert any(local_name(node.tag) == "text" for node in map_root.iter()), "Project Map has no visible text"
          assert any(local_name(node.tag) == "animateTransform" and node.attrib.get("dur") == "360s" for node in map_root.iter()), "Project Map 360s source motion drifted"
          assert any(local_name(node.tag) == "text" and node.attrib.get("font-size") == "9.2" for node in map_root.iter()), "Project Map 9.2px source text drifted"

          activity_root = ET.parse("assets/github-contributions-dark.svg").getroot()
          activity_text_count = [0]

          def walk(node, inherited_family=None):
              family = node.attrib.get("font-family", inherited_family)
              if local_name(node.tag) == "text":
                  activity_text_count[0] += 1
                  assert normalized(family) == EXPECTED, f"Activity text lacks reviewed font family: {ET.tostring(node, encoding='unicode')[:160]}"
              for child in node:
                  walk(child, family)

          walk(activity_root)
          assert activity_text_count[0] > 0, "Activity has no visible text"

          overlay = Path("assets/profile-v16-overlay-00.svg").read_text(encoding="utf-8")
          assert 'data-source-policy="embedded-adapted-copy-static-self-contained"' in overlay
          assert 'data-adaptation-policy="exact-direct-root-rect-removal-v1"' in overlay

          print(
              "LIVE_PROFILE_TEXT_FALLBACK_V14_PASS "
              f"mounted={len(mounted)} portal_surfaces=1 activity_text={activity_text_count[0]} "
              "portal=direct-remote-full-width-single-surface policy=system-ui-first source-owned-text-preserved"
          )
          PY
          git diff --check
