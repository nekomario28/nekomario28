name: Contributed live Pages proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contributed-live-pages-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    permissions:
      contents: read
    steps:
      - name: Install Playwright package
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save playwright@1.62.1

      - name: Validate live GitHub Pages UX
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/live-pages
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { chromium, webkit } = require('playwright');

          const liveUrl = 'https://nekomario28.github.io/interactive-project-map/u/?username=nekomario28&style=galaxy-systems';
          const releaseSha = 'b0734590a7ea65fea68eee9fb4e9b5c5d40ee8a0';

          function browserErrors(page) {
            const failures = [];
            page.on('pageerror', (error) => failures.push(`pageerror: ${error.message}`));
            page.on('console', (message) => { if (message.type() === 'error') failures.push(`console: ${message.text()}`); });
            return failures;
          }

          async function waitForLiveGraph(page) {
            await page.waitForFunction(() => {
              const status = document.querySelector('#status');
              return status?.hidden === true
                && window.ProjectMapViewState?.snapshot
                && window.ProjectMapContributedViewer?.snapshot;
            }, { timeout: 30_000 });
            await page.waitForFunction(() => window.ProjectMapContributedViewer.snapshot().contributedRepositories.length > 0, { timeout: 30_000 });
          }

          async function desktopPass() {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              const failures = browserErrors(page);
              const response = await page.goto(liveUrl, { waitUntil: 'domcontentloaded', timeout: 30_000 });
              assert.ok(response?.ok(), `live viewer returned ${response?.status()}`);
              await waitForLiveGraph(page);

              const initial = await page.evaluate(() => ({
                view: window.ProjectMapViewState.snapshot(),
                contributed: window.ProjectMapContributedViewer.snapshot(),
                buttonText: document.querySelector('[data-status-filter="contributed"]')?.textContent,
                buttonPressed: document.querySelector('[data-status-filter="contributed"]')?.getAttribute('aria-pressed'),
              }));
              assert.equal(initial.contributed.contributedRepositories.length, 6);
              assert.equal(initial.contributed.contributionEdges.length, 6);
              assert.equal(initial.view.statusCounts.contributed, 6);
              assert.ok(initial.view.statuses.includes('contributed'));
              assert.equal(initial.buttonText?.trim(), 'Contributed 6');
              assert.equal(initial.buttonPressed, 'true');

              const target = initial.contributed.contributedRepositories[0].replace(/^repository:/, '');
              await page.locator('#search').fill(target);
              await page.locator('#search').press('ArrowDown');
              await page.waitForFunction(() => document.querySelector('#detailsMeta')?.textContent?.includes('External owner'));
              const details = await page.locator('#detailsMeta').textContent();
              assert.match(details || '', /Contributed/);
              assert.match(details || '', /External owner/);
              assert.match(details || '', /Pull requests/);

              const contributedButton = page.locator('[data-status-filter="contributed"]');
              await contributedButton.click();
              await page.waitForFunction(() => document.querySelector('[data-status-filter="contributed"]')?.getAttribute('aria-pressed') === 'false');
              const hiddenState = await page.evaluate(() => ({
                statuses: window.ProjectMapViewState.snapshot().statuses,
                statusParam: new URL(location.href).searchParams.get('status'),
              }));
              assert.ok(!hiddenState.statuses.includes('contributed'));
              assert.ok(hiddenState.statusParam, 'status URL parameter was not serialized');

              await contributedButton.click();
              await page.waitForFunction(() => document.querySelector('[data-status-filter="contributed"]')?.getAttribute('aria-pressed') === 'true');
              await page.screenshot({ path: '.tmp/live-pages/desktop.png', fullPage: true });
              assert.deepEqual(failures, []);
              return { contributed: initial.view.statusCounts.contributed, errors: failures.length };
            } finally {
              await browser.close();
            }
          }

          async function mobilePass() {
            const browser = await webkit.launch();
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
              const failures = browserErrors(page);
              const url = `${liveUrl}&status=c`;
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30_000 });
              assert.ok(response?.ok(), `mobile live viewer returned ${response?.status()}`);
              await waitForLiveGraph(page);
              await page.waitForFunction(() => {
                const statuses = window.ProjectMapViewState.snapshot().statuses;
                return statuses.length === 1 && statuses[0] === 'contributed';
              });

              const geometry = await page.evaluate(() => {
                const footer = document.querySelector('footer');
                const note = footer?.querySelector(':scope > span:first-child');
                if (!footer || !note) return null;
                const footerRect = footer.getBoundingClientRect();
                const noteRect = note.getBoundingClientRect();
                const style = getComputedStyle(note);
                return {
                  viewportWidth: innerWidth,
                  viewportHeight: innerHeight,
                  documentScrollWidth: document.documentElement.scrollWidth,
                  footerLeft: footerRect.left,
                  footerRight: footerRect.right,
                  footerBottom: footerRect.bottom,
                  noteRight: noteRect.right,
                  overflow: style.overflow,
                  textOverflow: style.textOverflow,
                  whiteSpace: style.whiteSpace,
                  statuses: window.ProjectMapViewState.snapshot().statuses,
                  contributedCount: window.ProjectMapViewState.snapshot().statusCounts.contributed,
                };
              });
              assert.ok(geometry);
              assert.deepEqual(geometry.statuses, ['contributed']);
              assert.equal(geometry.contributedCount, 6);
              assert.ok(geometry.documentScrollWidth <= geometry.viewportWidth + 1);
              assert.ok(geometry.footerLeft >= -0.5);
              assert.ok(geometry.footerRight <= geometry.viewportWidth + 0.5);
              assert.ok(geometry.footerBottom <= geometry.viewportHeight + 0.5);
              assert.ok(geometry.noteRight <= geometry.footerRight + 0.5);
              assert.equal(geometry.overflow, 'hidden');
              assert.equal(geometry.textOverflow, 'ellipsis');
              assert.equal(geometry.whiteSpace, 'nowrap');
              await page.screenshot({ path: '.tmp/live-pages/mobile.png', fullPage: true });
              assert.deepEqual(failures, []);
              return { contributed: geometry.contributedCount, errors: failures.length };
            } finally {
              await browser.close();
            }
          }

          (async () => {
            const desktop = await desktopPass();
            const mobile = await mobilePass();
            const receipt = {
              status: 'success',
              runId: process.env.GITHUB_RUN_ID,
              releaseSha,
              liveUrl,
              desktopContributedRepositories: desktop.contributed,
              desktopDetailsAndStatusShare: true,
              mobileStatusAlias: true,
              mobileHorizontalOverflow: false,
              chromiumErrors: desktop.errors,
              webkitErrors: mobile.errors,
            };
            fs.writeFileSync('.tmp/live-pages/proof-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(JSON.stringify(receipt));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Finalize live proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/live-pages
          if [[ "${{ steps.validate.outcome }}" != "success" ]]; then
            cat > .tmp/live-pages/proof-receipt.json <<EOF
          {
            "status": "failed",
            "runId": "${GITHUB_RUN_ID}",
            "releaseSha": "b0734590a7ea65fea68eee9fb4e9b5c5d40ee8a0",
            "validateOutcome": "${{ steps.validate.outcome }}"
          }
          EOF
          fi

      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contributed-live-pages-proof
          path: .tmp/live-pages
          if-no-files-found: error
          retention-days: 3

  record:
    needs: live
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download live proof evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contributed-live-pages-proof
          path: .tmp/live-pages

      - name: Record live proof result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/proofs
          cp .tmp/live-pages/proof-receipt.json .github/proofs/contributed-live-pages-proof.json
          git add -- .github/proofs/contributed-live-pages-proof.json
          if git diff --cached --quiet; then
            echo "Live proof receipt is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "record Contributed live Pages proof"
          git push
