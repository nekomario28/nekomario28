name: Update seasonal profile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/seasons/*.svg"
      - "assets/profile-frame-bridge.svg"
      - "assets/profile-section-projects.svg"
      - "assets/profile-section-activity.svg"
      - "assets/profile-footer.svg"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/seasons/*.svg"
      - "assets/profile-frame-bridge.svg"
      - "assets/profile-section-projects.svg"
      - "assets/profile-section-activity.svg"
      - "assets/profile-footer.svg"
      - "README.md"
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to evaluate; auto resolves from Asia/Tokyo date"
        required: true
        type: choice
        default: auto
        options: [auto, spring, summer, autumn, winter]
      dry_run:
        description: "Validate and report without modifying stable live assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: seasonal-profile
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Validate seasonal policy and all envelope variants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile design-lab/scripts/select-season.py design-lab/scripts/promote-season.py design-lab/scripts/render_envelope_chrome.py
          python design-lab/scripts/promote-season.py --date 2026-04-01 --json
          python design-lab/scripts/promote-season.py --date 2026-07-01 --json
          python design-lab/scripts/promote-season.py --date 2026-10-01 --json
          python design-lab/scripts/promote-season.py --date 2026-01-01 --json
          python - <<'PY'
          import importlib.util, json, tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = json.loads(Path('design-lab/theme-manifest.json').read_text())
          assert manifest['version'] == 5
          assert set(manifest['seasons']) == {'spring','summer','autumn','winter'}
          assert set(manifest['live_assets']) == {'hero','bridge','projects','activity','footer'}

          for season, cfg in manifest['seasons'].items():
              hero = Path('design-lab') / cfg['hero']
              svg = ET.parse(hero).getroot()
              assert (svg.attrib['width'], svg.attrib['height'], svg.attrib['viewBox']) == ('900','260','0 0 900 260')
              text = hero.read_text()
              assert cfg['motion']['implementation'] == 'embedded-smil'
              assert cfg['motion']['static_fallback'] is True
              assert cfg['motion']['live_verification'] in {'NOT_RUN','PASS'}
              assert 'prefers-reduced-motion' in text and '<animate' in text
              assert '<script' not in text.lower()

          script = Path('design-lab/scripts/render_envelope_chrome.py')
          spec = importlib.util.spec_from_file_location('chrome', script)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          expected = {
              'assets/profile-frame-bridge.svg': ('900','32','0 0 900 32'),
              'assets/profile-section-projects.svg': ('900','68','0 0 900 68'),
              'assets/profile-section-activity.svg': ('900','68','0 0 900 68'),
              'assets/profile-footer.svg': ('900','92','0 0 900 92'),
          }
          for season in ('spring','summer','autumn','winter'):
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp); module.render(season, root)
                  for rel, geometry in expected.items():
                      path = root / rel
                      svg = ET.parse(path).getroot()
                      assert (svg.attrib['width'], svg.attrib['height'], svg.attrib['viewBox']) == geometry
                      text = path.read_text()
                      assert 'M18' in text and 'M882' in text, (season, rel, 'missing-frame-rails')
                      if 'profile-section-' in rel:
                          assert '<text' not in text.lower()
                          assert '<path' in text.lower()
          PY

      - name: Resolve and promote seasonal envelope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SEASON: ${{ inputs.season }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--json)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ -z "${REQUESTED_SEASON:-}" || "$REQUESTED_SEASON" == auto ]] || args+=(--season "$REQUESTED_SEASON")
            [[ "${DRY_RUN:-true}" == true ]] || args+=(--apply)
          elif [[ "$EVENT_NAME" == schedule ]]; then
            args+=(--apply)
          fi
          python design-lab/scripts/promote-season.py "${args[@]}" | tee "$RUNNER_TEMP/season-result.json"

      - name: Validate stable live envelope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
              'hero': ('900','260','0 0 900 260'),
              'bridge': ('900','32','0 0 900 32'),
              'projects': ('900','68','0 0 900 68'),
              'activity': ('900','68','0 0 900 68'),
              'footer': ('900','92','0 0 900 92'),
          }
          state = json.loads(Path('design-lab/live-theme.json').read_text())
          assert state['envelope_version'] == 4
          assert set(state['live_assets']) == set(expected)
          assert state['frame']['mode'] == 'segmented-bridge-v2'
          assert state['frame']['shared_edge_rails'] is True
          assert state['frame']['true_overlay'] is False
          for key, geometry in expected.items():
              path = Path(state['live_assets'][key]); svg = ET.parse(path).getroot()
              assert (svg.attrib['width'], svg.attrib['height'], svg.attrib['viewBox']) == geometry
              text = path.read_text()
              if key in {'bridge','projects','activity','footer'}:
                  assert 'M18' in text and 'M882' in text
              if key in {'projects','activity'}:
                  assert '<text' not in text.lower() and '<path' in text.lower()
          hero = Path(state['live_assets']['hero']).read_text()
          assert 'prefers-reduced-motion' in hero and '<animate' in hero and '<script' not in hero.lower()
          readme = Path('README.md').read_text()
          for rel in state['live_assets'].values(): assert rel in readme
          assert readme.count('assets/profile-frame-bridge.svg') == 3
          assert 'assets/profile-divider.svg' not in readme
          PY

      - name: Commit seasonal change
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-hero.svg assets/profile-frame-bridge.svg assets/profile-section-projects.svg assets/profile-section-activity.svg assets/profile-footer.svg design-lab/live-theme.json
          if git diff --cached --quiet; then echo "Seasonal profile envelope is already current."; exit 0; fi
          season="$(python -c 'import json; print(json.load(open("design-lab/live-theme.json"))["active_season"])')"
          git commit -m "switch profile envelope to ${season}"
          git push
