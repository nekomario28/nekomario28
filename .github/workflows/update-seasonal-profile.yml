name: Update seasonal profile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/envelope-v7/**"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/seasons/*.svg"
      - "project-map/galaxy.svg"
      - "assets/github-contributions-dark.svg"
      - "assets/profile-*.svg"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/envelope-v7/**"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/seasons/*.svg"
      - "project-map/galaxy.svg"
      - "assets/github-contributions-dark.svg"
      - "assets/profile-*.svg"
      - "README.md"
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to evaluate; auto resolves from Asia/Tokyo date"
        required: true
        type: choice
        default: auto
        options: [auto, spring, summer, autumn, winter]
      dry_run:
        description: "Validate and report without modifying stable live assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: seasonal-profile
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact profile revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate Envelope v7 source and all seasons
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            design-lab/scripts/select-season.py \
            design-lab/scripts/promote-season.py \
            design-lab/scripts/render_envelope_chrome.py \
            design-lab/envelope-v7/render_panels.py \
            design-lab/envelope-v7/render_continuous_canvas.py \
            design-lab/envelope-v7/validate.py
          python design-lab/envelope-v7/validate.py
          python design-lab/scripts/promote-season.py --date 2026-04-01 --json
          python design-lab/scripts/promote-season.py --date 2026-07-01 --json
          python design-lab/scripts/promote-season.py --date 2026-10-01 --json
          python design-lab/scripts/promote-season.py --date 2026-01-01 --json
          git diff --check

      - name: Resolve seasonal Envelope v7
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SEASON: ${{ inputs.season }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--json)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ -z "${REQUESTED_SEASON:-}" || "$REQUESTED_SEASON" == auto ]] || args+=(--season "$REQUESTED_SEASON")
            [[ "${DRY_RUN:-true}" == true ]] || args+=(--apply)
          elif [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == schedule || "$EVENT_NAME" == push ]]; then
            args+=(--apply)
          fi
          python design-lab/scripts/promote-season.py "${args[@]}" | tee "$RUNNER_TEMP/season-result.json"
          git diff --check

      - name: Validate stable live Envelope v7
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, xml.etree.ElementTree as ET
          from pathlib import Path

          state = json.loads(Path('design-lab/live-theme.json').read_text())
          expected = {
              'hero': ('900','260','0 0 900 260'),
              'character_left': ('100','394','0 0 100 394'),
              'character_right': ('100','394','0 0 100 394'),
              'attribution': ('900','44','0 0 900 44'),
              'bridge_character_projects': ('900','32','0 0 900 32'),
              'projects': ('900','68','0 0 900 68'),
              'projects_canvas': ('900','420','0 0 900 420'),
              'bridge_projects_activity': ('900','32','0 0 900 32'),
              'activity': ('900','68','0 0 900 68'),
              'activity_canvas': ('900','220','0 0 900 220'),
              'bridge_activity_footer': ('900','32','0 0 900 32'),
              'footer': ('900','92','0 0 900 92'),
          }
          source_sync = {
              'projects_canvas': 'project-map/galaxy.svg',
              'activity_canvas': 'assets/github-contributions-dark.svg',
          }
          assert state['envelope_version'] == 7
          assert set(state['live_assets']) == set(expected)
          assert state['global_motion_space'] == 'design-lab/envelope-v7/global-motion-space.json'
          frame = state['frame']
          assert frame['mode'] == 'continuous-canvas-global-windowed-flow'
          assert frame['all_logical_windows_rendered'] is True
          assert frame['mounted_foreground_media'] is True
          assert frame['boundary_fade'] is False
          assert frame['partial_geometry_clipping'] is True
          assert frame['cross_document_hard_sync'] is False
          assert frame['true_overlay'] is False
          for key, geometry in expected.items():
              path = Path(state['live_assets'][key])
              assert path.is_file(), path
              root = ET.parse(path).getroot()
              assert (root.attrib.get('width'), root.attrib.get('height'), root.attrib.get('viewBox')) == geometry
              text = path.read_text()
              assert 'id="v7-global-window"' in text
              assert 'clip-path="url(#v7-window)"' in text
              assert 'prefers-reduced-motion' in text and '<animateTransform' in text and 'dur="32s"' in text
              assert '<script' not in text.lower()
              if key in source_sync:
                  source_rel = source_sync[key]
                  source = Path(source_rel)
                  digest = hashlib.sha256(source.read_bytes()).hexdigest()
                  assert root.attrib.get('data-source-path') == source_rel, (key, root.attrib.get('data-source-path'), source_rel)
                  assert root.attrib.get('data-source-sha256') == digest, (key, root.attrib.get('data-source-sha256'), digest)
                  if key == 'projects_canvas' and 'data-galaxy-external-layout="rail"' in source.read_text():
                      assert 'data-galaxy-external-layout="rail"' in text
          readme = Path('README.md').read_text()
          for rel in state['live_assets'].values():
              assert readme.count(rel) == 1, rel
          assert readme.count('https://konosuba.com/bakuen/story/img/pdsfi4/05.jpg') == 1
          print('ENVELOPE_V7_LIVE_SOURCE_SYNC_PASS')
          PY

      - name: Commit seasonal change
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/profile-hero.svg \
            assets/profile-character-side-left.svg \
            assets/profile-character-side-right.svg \
            assets/profile-attribution.svg \
            assets/profile-frame-bridge-character-projects.svg \
            assets/profile-section-projects.svg \
            assets/profile-projects-canvas.svg \
            assets/profile-frame-bridge-projects-activity.svg \
            assets/profile-section-activity.svg \
            assets/profile-activity-canvas.svg \
            assets/profile-frame-bridge-activity-footer.svg \
            assets/profile-footer.svg \
            design-lab/live-theme.json
          if git diff --cached --quiet; then
            echo "Seasonal Envelope v7 is already current."
            exit 0
          fi
          season="$(python -c 'import json; print(json.load(open("design-lab/live-theme.json"))["active_season"])')"
          git commit -m "switch profile envelope to ${season}"
          git push origin HEAD:main
