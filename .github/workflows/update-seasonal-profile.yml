name: Update seasonal profile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/seasons/*.svg"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/seasons/*.svg"
      - "README.md"
  schedule:
    # 00:17 UTC = 09:17 JST. Monthly checks are cheap; only season boundaries mutate files.
    - cron: "17 0 1 * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to evaluate; auto resolves from Asia/Tokyo date"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - spring
          - summer
          - autumn
          - winter
      dry_run:
        description: "Validate and report without modifying stable live assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: seasonal-profile
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Validate seasonal policy and all envelope variants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            design-lab/scripts/select-season.py \
            design-lab/scripts/promote-season.py \
            design-lab/scripts/render_envelope_chrome.py

          python design-lab/scripts/promote-season.py --date 2026-04-01 --json
          python design-lab/scripts/promote-season.py --date 2026-07-01 --json
          python design-lab/scripts/promote-season.py --date 2026-10-01 --json
          python design-lab/scripts/promote-season.py --date 2026-01-01 --json

          python - <<'PY'
          import importlib.util
          import tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          script = Path('design-lab/scripts/render_envelope_chrome.py')
          spec = importlib.util.spec_from_file_location('render_envelope_chrome', script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          expected = {
              'assets/profile-section-projects.svg': ('900', '68', '0 0 900 68'),
              'assets/profile-section-activity.svg': ('900', '68', '0 0 900 68'),
              'assets/profile-footer.svg': ('900', '92', '0 0 900 92'),
          }
          for season in ('spring', 'summer', 'autumn', 'winter'):
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  module.render(season, root)
                  for rel, (width, height, viewbox) in expected.items():
                      path = root / rel
                      svg = ET.parse(path).getroot()
                      assert svg.attrib['width'] == width, (season, rel, 'width')
                      assert svg.attrib['height'] == height, (season, rel, 'height')
                      assert svg.attrib['viewBox'] == viewbox, (season, rel, 'viewBox')
          PY

      - name: Resolve and promote seasonal envelope
        id: promote
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SEASON: ${{ inputs.season }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--json)

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "${REQUESTED_SEASON:-}" && "$REQUESTED_SEASON" != "auto" ]]; then
              args+=(--season "$REQUESTED_SEASON")
            fi
            if [[ "${DRY_RUN:-true}" != "true" ]]; then
              args+=(--apply)
            fi
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            args+=(--apply)
          fi

          python design-lab/scripts/promote-season.py "${args[@]}" | tee "$RUNNER_TEMP/season-result.json"

      - name: Validate stable live envelope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = {
              'hero': ('900', '260', '0 0 900 260'),
              'projects': ('900', '68', '0 0 900 68'),
              'activity': ('900', '68', '0 0 900 68'),
              'footer': ('900', '92', '0 0 900 92'),
          }
          state = json.loads(Path('design-lab/live-theme.json').read_text())
          assert state['envelope_version'] == 3
          assert state['active_season'] in {'spring', 'summer', 'autumn', 'winter'}
          assert set(state['live_assets']) == set(expected)
          assert state['motion']['static_fallback'] is True
          for key, (width, height, viewbox) in expected.items():
              path = Path(state['live_assets'][key])
              assert path.is_file(), path
              svg = ET.parse(path).getroot()
              assert svg.attrib['width'] == width, (key, 'width')
              assert svg.attrib['height'] == height, (key, 'height')
              assert svg.attrib['viewBox'] == viewbox, (key, 'viewBox')
          hero_text = Path(state['live_assets']['hero']).read_text()
          assert 'prefers-reduced-motion' in hero_text
          assert '<animate' in hero_text
          assert '<script' not in hero_text.lower()
          readme = Path('README.md').read_text()
          for rel in state['live_assets'].values():
              assert rel in readme, rel
          assert 'assets/profile-divider.svg' not in readme
          PY

      - name: Commit seasonal change
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/profile-hero.svg \
            assets/profile-section-projects.svg \
            assets/profile-section-activity.svg \
            assets/profile-footer.svg \
            design-lab/live-theme.json

          if git diff --cached --quiet; then
            echo "Seasonal profile envelope is already current."
            exit 0
          fi

          season="$(python -c 'import json; print(json.load(open("design-lab/live-theme.json"))["active_season"])')"
          git commit -m "switch profile envelope to ${season}"
          git push
