name: Update seasonal profile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/envelope-v6/**"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/scripts/render_global_motion.py"
      - "design-lab/seasons/*.svg"
      - "assets/profile-hero.svg"
      - "assets/profile-frame-bridge-character-projects.svg"
      - "assets/profile-section-projects.svg"
      - "assets/profile-frame-bridge-projects-activity.svg"
      - "assets/profile-section-activity.svg"
      - "assets/profile-frame-bridge-activity-footer.svg"
      - "assets/profile-footer.svg"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-seasonal-profile.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/live-theme.json"
      - "design-lab/envelope-v6/**"
      - "design-lab/scripts/select-season.py"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/scripts/render_global_motion.py"
      - "design-lab/seasons/*.svg"
      - "assets/profile-hero.svg"
      - "assets/profile-frame-bridge-character-projects.svg"
      - "assets/profile-section-projects.svg"
      - "assets/profile-frame-bridge-projects-activity.svg"
      - "assets/profile-section-activity.svg"
      - "assets/profile-frame-bridge-activity-footer.svg"
      - "assets/profile-footer.svg"
      - "README.md"
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to evaluate; auto resolves from Asia/Tokyo date"
        required: true
        type: choice
        default: auto
        options: [auto, spring, summer, autumn, winter]
      dry_run:
        description: "Validate and report without modifying stable live assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: seasonal-profile
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Validate all Envelope v6 seasonal variants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            design-lab/scripts/select-season.py \
            design-lab/scripts/promote-season.py \
            design-lab/scripts/render_envelope_chrome.py \
            design-lab/scripts/render_global_motion.py

          python design-lab/scripts/promote-season.py --date 2026-04-01 --json
          python design-lab/scripts/promote-season.py --date 2026-07-01 --json
          python design-lab/scripts/promote-season.py --date 2026-10-01 --json
          python design-lab/scripts/promote-season.py --date 2026-01-01 --json

          python - <<'PY'
          import importlib.util, json, tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = json.loads(Path('design-lab/theme-manifest.json').read_text())
          assert manifest['version'] == 7
          assert set(manifest['seasons']) == {'spring','summer','autumn','winter'}
          expected = {
              'hero': ('assets/profile-hero.svg', ('900','260','0 0 900 260')),
              'bridge_character_projects': ('assets/profile-frame-bridge-character-projects.svg', ('900','32','0 0 900 32')),
              'projects': ('assets/profile-section-projects.svg', ('900','68','0 0 900 68')),
              'bridge_projects_activity': ('assets/profile-frame-bridge-projects-activity.svg', ('900','32','0 0 900 32')),
              'activity': ('assets/profile-section-activity.svg', ('900','68','0 0 900 68')),
              'bridge_activity_footer': ('assets/profile-frame-bridge-activity-footer.svg', ('900','32','0 0 900 32')),
              'footer': ('assets/profile-footer.svg', ('900','92','0 0 900 92')),
          }
          assert manifest['live_assets'] == {k:v[0] for k,v in expected.items()}
          flow = manifest['envelope_motion']
          assert flow['mode'] == 'global-coordinate-windowed-handoff'
          assert flow['coordinate_system'] == 'profile-envelope-logical-y-v1'
          assert flow['render_model'] == 'shared-global-field-clipped-by-local-window'
          assert flow['space'] == 'design-lab/envelope-v6/global-motion-space.json'
          assert flow['rail_x'] == [18, 882]
          assert flow['duration_seconds'] == 36
          assert flow['global_extent'] == 1868
          assert flow['bleed'] == 24
          assert flow['boundary_fade'] is False
          assert flow['partial_geometry_clipping'] is True
          assert flow['cross_document_hard_sync'] is False
          assert flow['static_fallback'] is True
          assert flow['reduced_motion'] is True

          script = Path('design-lab/scripts/render_global_motion.py')
          spec = importlib.util.spec_from_file_location('flow', script)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          space = json.loads(Path(flow['space']).read_text())
          module.validate_space(space)
          visible = {
              w['asset_key']: (name, int(w['start']), int(w['end']), int(w['height']))
              for name,w in space['windows'].items() if w.get('rendered')
          }
          assert set(visible) == set(expected)
          assert [visible[k][1] for k in ('bridge_character_projects','bridge_projects_activity','bridge_activity_footer')] == [765,1360,1744]

          for season, cfg in manifest['seasons'].items():
              source = Path('design-lab') / cfg['hero']
              source_root = ET.parse(source).getroot()
              assert (source_root.attrib['width'], source_root.attrib['height'], source_root.attrib['viewBox']) == ('900','260','0 0 900 260')
              source_text = source.read_text()
              assert cfg['motion']['implementation'] == 'embedded-smil'
              assert cfg['motion']['static_fallback'] is True
              assert cfg['motion']['live_verification'] in {'NOT_RUN','PASS'}
              assert 'prefers-reduced-motion' in source_text and '<animate' in source_text
              assert '<script' not in source_text.lower()

              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp); module.render(season, root)
                  for key, (rel, geometry) in expected.items():
                      path = root / rel
                      svg = ET.parse(path).getroot()
                      assert (svg.attrib['width'], svg.attrib['height'], svg.attrib['viewBox']) == geometry
                      text = path.read_text()
                      name,start,end,height = visible[key]
                      assert 'id="v6-global-window"' in text
                      assert f'data-window="{name}"' in text
                      assert f'data-global-start="{start}"' in text
                      assert f'data-global-end="{end}"' in text
                      assert f'data-global-extent="{space["global_extent"]}"' in text
                      assert 'clip-path="url(#v6-window)"' in text
                      assert 'prefers-reduced-motion' in text
                      assert '<animateTransform' in text and 'dur="36s"' in text
                      assert '<script' not in text.lower()
                      v6_tail = text.split('id="v6-global-window"',1)[1]
                      assert '<animate attributeName="opacity"' not in v6_tail
                      local_from = -int(space['bleed']) - start
                      local_to = int(space['global_extent']) + int(space['bleed']) - start
                      assert f'values="0 {local_from};0 {local_to}"' in text
                      if key in {'projects','activity'}:
                          assert '<text' not in text.lower() and '<path' in text.lower()
                  hero = (root / expected['hero'][0]).read_text()
                  footer = (root / expected['footer'][0]).read_text()
                  assert 'M18 30V18Q18 7 30 7H76' in hero
                  assert 'Q18 85 30 85H76' in footer
          PY

      - name: Resolve and promote seasonal envelope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SEASON: ${{ inputs.season }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--json)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ -z "${REQUESTED_SEASON:-}" || "$REQUESTED_SEASON" == auto ]] || args+=(--season "$REQUESTED_SEASON")
            [[ "${DRY_RUN:-true}" == true ]] || args+=(--apply)
          elif [[ "$EVENT_NAME" == schedule ]]; then
            args+=(--apply)
          fi
          python design-lab/scripts/promote-season.py "${args[@]}" | tee "$RUNNER_TEMP/season-result.json"

      - name: Validate stable live Envelope v6
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
              'hero': ('900','260','0 0 900 260'),
              'bridge_character_projects': ('900','32','0 0 900 32'),
              'projects': ('900','68','0 0 900 68'),
              'bridge_projects_activity': ('900','32','0 0 900 32'),
              'activity': ('900','68','0 0 900 68'),
              'bridge_activity_footer': ('900','32','0 0 900 32'),
              'footer': ('900','92','0 0 900 92'),
          }
          state = json.loads(Path('design-lab/live-theme.json').read_text())
          assert state['envelope_version'] == 6
          assert set(state['live_assets']) == set(expected)
          assert state['global_motion_space'] == 'design-lab/envelope-v6/global-motion-space.json'
          frame = state['frame']
          assert frame['mode'] == 'global-windowed-flow'
          assert frame['shared_edge_rails'] is True
          assert frame['top_cap'] is True and frame['bottom_cap'] is True
          assert frame['global_coordinate_space'] is True
          assert frame['shared_global_object_field'] is True
          assert frame['window_clipping'] is True
          assert frame['boundary_fade'] is False
          assert frame['partial_geometry_clipping'] is True
          assert frame['unique_bridge_windows'] is True
          assert frame['phase_tolerant_handoff'] is True
          assert frame['cross_document_hard_sync'] is False
          assert frame['true_overlay'] is False
          for key, geometry in expected.items():
              path = Path(state['live_assets'][key]); svg = ET.parse(path).getroot()
              assert (svg.attrib['width'], svg.attrib['height'], svg.attrib['viewBox']) == geometry
              text = path.read_text()
              assert 'id="v6-global-window"' in text
              assert 'clip-path="url(#v6-window)"' in text
              assert 'prefers-reduced-motion' in text and '<animateTransform' in text and 'dur="36s"' in text
              assert '<script' not in text.lower()
              if key in {'projects','activity'}:
                  assert '<text' not in text.lower() and '<path' in text.lower()
          readme = Path('README.md').read_text()
          for rel in state['live_assets'].values():
              assert readme.count(rel) == 1
          assert 'assets/profile-frame-bridge.svg' not in readme
          assert 'assets/profile-divider.svg' not in readme
          PY

      - name: Commit seasonal change
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/profile-hero.svg \
            assets/profile-frame-bridge-character-projects.svg \
            assets/profile-section-projects.svg \
            assets/profile-frame-bridge-projects-activity.svg \
            assets/profile-section-activity.svg \
            assets/profile-frame-bridge-activity-footer.svg \
            assets/profile-footer.svg \
            design-lab/live-theme.json
          if git diff --cached --quiet; then echo "Seasonal profile envelope is already current."; exit 0; fi
          season="$(python -c 'import json; print(json.load(open("design-lab/live-theme.json"))["active_season"])')"
          git commit -m "switch profile envelope to ${season}"
          git push
