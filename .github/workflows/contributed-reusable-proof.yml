name: Contributed reusable release proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contributed-reusable-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    permissions:
      contents: read
    uses: nekomario28/interactive-project-map/.github/workflows/generate-project-map.yml@b0734590a7ea65fea68eee9fb4e9b5c5d40ee8a0
    with:
      theme: dark
      style: galaxy-systems
      max_repos: "100"
      forks: true
      archived: true
      contributed: true

  validate:
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Record reusable generation failure
        if: needs.generate.result != 'success'
        shell: bash
        run: |
          mkdir -p .tmp
          cat > .tmp/proof-receipt.json <<EOF
          {
            "status": "failed",
            "runId": "${GITHUB_RUN_ID}",
            "releaseSha": "b0734590a7ea65fea68eee9fb4e9b5c5d40ee8a0",
            "innerActionSha": "e5dafc86bec1cee6d913deaf040a2631599afb53",
            "generateOutcome": "${{ needs.generate.result }}"
          }
          EOF

      - name: Download reusable generated artifact
        if: needs.generate.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-map-generated
          path: .tmp/generated

      - name: Validate exact reusable release output
        if: needs.generate.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const candidates = ['.tmp/generated/graph.json', '.tmp/generated/project-map/graph.json'];
          const path = candidates.find((candidate) => fs.existsSync(candidate));
          if (!path) throw new Error('reusable artifact is missing graph.json');
          const graph = JSON.parse(fs.readFileSync(path, 'utf8'));
          const owner = 'nekomario28';
          const ownerId = `user:${owner}`;
          if (String(graph.owner || '').toLowerCase() !== owner) throw new Error('owner mismatch');
          if (!Array.isArray(graph.nodes) || !Array.isArray(graph.edges)) throw new Error('missing graph arrays');
          const repos = graph.nodes.filter((node) => node?.type === 'repository');
          const contributed = repos.filter((node) => node?.relation === 'contributed');
          const contributedIds = new Set(contributed.map((node) => node.id));
          const owned = repos.filter((node) => node?.relation !== 'contributed');
          if (contributed.length < 1) throw new Error('exact reusable workflow did not forward contributed=true');
          if (graph.repositoryCount !== owned.length) throw new Error('owned repositoryCount was polluted by Contributed');
          if (graph.contributedRepositoryCount !== contributed.length) throw new Error('contributedRepositoryCount mismatch');
          if (graph.externalContributions?.includedRepositories !== contributed.length) throw new Error('external contribution diagnostics mismatch');

          const forbiddenKeys = new Set(['private', 'isPrivate', 'restricted', 'isRestricted']);
          function inspectKeys(value) {
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKeys.has(key)) throw new Error(`forbidden privacy key serialized: ${key}`);
              inspectKeys(child);
            }
          }
          inspectKeys(graph);

          for (const node of contributed) {
            const externalOwner = String(node.repositoryOwner || '');
            const name = String(node.repositoryName || '');
            if (!externalOwner || !name || externalOwner.toLowerCase() === owner) throw new Error('invalid external owner identity');
            if (String(node.label || '').toLowerCase() !== `${externalOwner}/${name}`.toLowerCase()) throw new Error('external owner/repo label mismatch');
            if ('groupId' in node || 'groupLabel' in node) throw new Error('Contributed node gained owned category membership');
          }

          const contributionEdges = graph.edges.filter((edge) => contributedIds.has(edge?.target));
          if (contributionEdges.length !== contributed.length) throw new Error('Contributed edge cardinality mismatch');
          if (contributionEdges.some((edge) => edge.type !== 'contribution' || edge.source !== ownerId)) throw new Error('ownership/membership path reaches external repository');
          if (graph.edges.some((edge) => ['ownership', 'membership'].includes(edge?.type) && contributedIds.has(edge?.target))) throw new Error('owned structural edge reaches Contributed');
          if ((graph.semanticEdges || []).some((edge) => contributedIds.has(edge?.source) || contributedIds.has(edge?.target))) throw new Error('Contributed leaked into owned semantic graph');

          const receipt = {
            status: 'success',
            runId: process.env.GITHUB_RUN_ID,
            releaseSha: 'b0734590a7ea65fea68eee9fb4e9b5c5d40ee8a0',
            innerActionSha: 'e5dafc86bec1cee6d913deaf040a2631599afb53',
            graphGeneratedAt: graph.generatedAt || null,
            contributionWindow: graph.externalContributions?.window || null,
            ownedRepositories: owned.length,
            contributedRepositories: contributed.length,
            contributionEdges: contributionEdges.length,
            privacyKeysSerialized: 0,
            ownershipViolations: 0,
          };
          fs.mkdirSync('.tmp', { recursive: true });
          fs.writeFileSync('.tmp/proof-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt));
          NODE

      - name: Upload reusable proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contributed-reusable-proof-receipt
          path: .tmp/proof-receipt.json
          if-no-files-found: error
          retention-days: 1

      - name: Propagate reusable generation failure
        if: needs.generate.result != 'success'
        run: exit 1

  record:
    needs: [generate, validate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download reusable proof receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contributed-reusable-proof-receipt
          path: .tmp/receipt

      - name: Record reusable proof result without repository names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/proofs
          cp .tmp/receipt/proof-receipt.json .github/proofs/contributed-reusable-proof.json
          git add -- .github/proofs/contributed-reusable-proof.json
          if git diff --cached --quiet; then
            echo "Reusable proof receipt is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "record Contributed reusable proof"
          git push
