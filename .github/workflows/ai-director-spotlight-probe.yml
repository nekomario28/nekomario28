name: AI Director Spotlight execution probe

on:
  push:
    branches:
      - exp/ai-director-spotlight-outcomes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Environment
        run: |
          set -euxo pipefail
          python --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 2

      - name: Install clients
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade huggingface_hub gradio_client

      - name: Execute split-shot and fresh-regeneration outcomes
        run: |
          set -euxo pipefail
          python experiments/ai_director/run_spotlight_outcomes.py
          find outcomes -maxdepth 4 -type f -printf '%p %s bytes\n' | sort

      - name: Upload outcome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-director-spotlight-outcomes-${{ github.run_id }}
          path: outcomes
          if-no-files-found: error
          retention-days: 14
