name: AI Director Spotlight execution probe

on:
  push:
    branches:
      - exp/ai-director-spotlight-outcomes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wan-stateful-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Environment
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q --upgrade huggingface_hub gradio_client requests
      - name: Probe stateful fresh and anchor generation
        run: |
          set -euxo pipefail
          python experiments/ai_director/probe_wan_stateful.py
          find wan_state_probe -maxdepth 4 -type f -printf '%p %s bytes\n' | sort
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-director-wan-state-probe-${{ github.run_id }}
          path: wan_state_probe
          if-no-files-found: warn
          retention-days: 14
