name: Envelope v6 public profile proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/envelope-v6-public-profile-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install proof-only helpers
        shell: bash
        run: python -m pip install --quiet websocket-client pillow

      - name: Capture persistent public-profile motion
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          out="$RUNNER_TEMP/envelope-v6-public-profile-proof"
          mkdir -p "$out"
          export OUT="$out"

          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --window-size=1440,3000 about:blank >"$out/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:9222/json/list >"$out/targets.json" && break
            sleep .2
          done
          test -s "$out/targets.json"

          python - <<'PY'
          import base64, json, os, time
          from pathlib import Path
          import websocket
          from PIL import Image, ImageChops

          out = Path(os.environ['OUT'])
          targets = json.loads((out / 'targets.json').read_text())
          target = next(t for t in targets if t.get('type') == 'page')
          ws = websocket.create_connection(target['webSocketDebuggerUrl'], timeout=20)
          seq = 0

          def call(method, params=None):
              global seq
              seq += 1
              ident = seq
              ws.send(json.dumps({'id': ident, 'method': method, 'params': params or {}}))
              while True:
                  msg = json.loads(ws.recv())
                  if msg.get('id') == ident:
                      if 'error' in msg:
                          raise RuntimeError(f"CDP {method}: {msg['error']}")
                      return msg.get('result', {})

          def evaluate(expr):
              return call('Runtime.evaluate', {'expression': expr, 'returnByValue': True, 'awaitPromise': True}).get('result', {}).get('value')

          def wait_complete(timeout=15):
              end = time.time() + timeout
              while time.time() < end:
                  if evaluate('document.readyState') == 'complete': return
                  time.sleep(.1)
              raise RuntimeError('page did not reach readyState=complete')

          def capture(name, clip=None):
              params = {'format': 'png', 'captureBeyondViewport': False}
              if clip:
                  params['clip'] = {**clip, 'scale': 1}
                  params['captureBeyondViewport'] = True
              data = call('Page.captureScreenshot', params)['data']
              (out / name).write_bytes(base64.b64decode(data))

          call('Page.enable')
          call('Runtime.enable')
          call('Emulation.setEmulatedMedia', {'features': [{'name': 'prefers-color-scheme', 'value': 'dark'}]})
          call('Emulation.setDeviceMetricsOverride', {'width': 1440, 'height': 3000, 'deviceScaleFactor': 1, 'mobile': False})
          call('Page.navigate', {'url': 'https://github.com/nekomario28'})
          wait_complete()

          time.sleep(1)
          bridge_rects = evaluate("""(() => Array.from(document.images).filter(i => i.src.includes('profile-frame-bridge-character-projects.svg')).map(i => { const r=i.getBoundingClientRect(); return {src:i.src,x:r.x,y:r.y,width:r.width,height:r.height}; }))()""") or []
          if not bridge_rects:
              raise RuntimeError('v6 bridge asset was not found on public profile DOM')
          r = bridge_rects[0]
          clip = {'x': r['x'], 'y': r['y'], 'width': r['width'], 'height': r['height']}

          # Sample the same live bridge every 250 ms for 7 seconds. v6 particles are
          # phase-spaced every 6 seconds, so at least one rail crossing should occur.
          sample_names = []
          start = time.monotonic()
          for i in range(29):
              name = f'bridge-sample-{i:02d}.png'
              capture(name, clip=clip)
              sample_names.append(name)
              target_t = start + (i + 1) * 0.25
              time.sleep(max(0, target_t - time.monotonic()))

          max_changed = 0
          changed_pairs = []
          for i in range(len(sample_names) - 1):
              a = Image.open(out / sample_names[i]).convert('RGB')
              b = Image.open(out / sample_names[i+1]).convert('RGB')
              d = ImageChops.difference(a, b)
              changed = sum(1 for px in d.getdata() if px != (0,0,0))
              if changed:
                  changed_pairs.append({'from': i, 'to': i+1, 'changed_pixels': changed, 'bbox': d.getbbox()})
                  max_changed = max(max_changed, changed)

          capture('profile-desktop-dark-final.png')
          call('Emulation.setDeviceMetricsOverride', {'width': 430, 'height': 3000, 'deviceScaleFactor': 1, 'mobile': True})
          time.sleep(.5)
          capture('profile-mobile-dark-final.png')

          metrics = {
              'public_bridge_rect': r,
              'sample_interval_seconds': 0.25,
              'sample_duration_seconds': 7.0,
              'sample_count': len(sample_names),
              'changed_pairs': changed_pairs,
              'max_changed_pixels_between_adjacent_samples': max_changed,
              'proof_scope': 'actual public GitHub profile, one persistent Chrome page'
          }
          (out / 'metrics.json').write_text(json.dumps(metrics, indent=2))
          print(json.dumps(metrics, indent=2))

          if not changed_pairs:
              raise RuntimeError('no visible change observed in v6 bridge across 7-second persistent-page sample')
          PY

          sha256sum "$out"/*.png | tee "$out/sha256.txt"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envelope-v6-public-profile-proof
          path: ${{ runner.temp }}/envelope-v6-public-profile-proof/*
          if-no-files-found: error
          retention-days: 1
