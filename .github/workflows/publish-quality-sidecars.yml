name: Publish experimental Quality sidecars

on:
  workflow_run:
    workflows: ["Update project map"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-quality-sidecars.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-quality-sidecars.yml"

permissions:
  contents: read

concurrency:
  group: quality-sidecars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IPM_QUALITY_TOOLS_REF: 62870393d022646d1e356713d17d20d9dea11ef2
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_branch || github.sha }}
          fetch-depth: 0

      - name: Checkout experimental assessment tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nekomario28/interactive-project-map
          ref: ${{ env.IPM_QUALITY_TOOLS_REF }}
          path: .ipm-quality-tools
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate bounded assessment and presentation candidates
        shell: bash
        run: |
          set -euo pipefail
          node .ipm-quality-tools/scripts/repository-quality-live-sidecar-candidate.mjs \
            --graph project-map/graph.json \
            --out-dir .quality-sidecars \
            --generator-revision "$IPM_QUALITY_TOOLS_REF"
          cp .quality-sidecars/assessment.json project-map/assessment.json
          cp .quality-sidecars/quality-presentation.json project-map/quality-presentation.json

      - name: Validate sidecar authority, attribution and evidence freshness
        shell: bash
        run: |
          set -euo pipefail
          test -s project-map/assessment.json
          test -s project-map/quality-presentation.json
          test -s .quality-sidecars/quality-sidecar-diagnostics.json
          node <<'NODE'
          const fs = require('node:fs');
          const graph = JSON.parse(fs.readFileSync('project-map/graph.json', 'utf8'));
          const assessment = JSON.parse(fs.readFileSync('project-map/assessment.json', 'utf8'));
          const presentation = JSON.parse(fs.readFileSync('project-map/quality-presentation.json', 'utf8'));
          const diagnostics = JSON.parse(fs.readFileSync('.quality-sidecars/quality-sidecar-diagnostics.json', 'utf8'));
          const graphRepositories = graph.nodes.filter((node) => node?.type === 'repository');
          const graphIds = new Set(graphRepositories.map((node) => node.id));
          const assessmentIds = new Set(assessment.repositories.map((entry) => entry.identity.graphNodeId));
          const presentationIds = new Set(presentation.repositories.map((entry) => entry.graphNodeId));
          const normalizeKey = (value) => String(value || '').toLowerCase();
          const validSnapshotDate = (value) => {
            const date = String(value || '');
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;
            const parsed = new Date(`${date}T00:00:00Z`);
            return !Number.isNaN(parsed.valueOf()) && parsed.toISOString().slice(0, 10) === date;
          };
          const expectedAssessmentSources = new Set([
            'nekomario28/interactive-project-map',
            'nekomario28/projexd_group10',
            'nekomario28/antifullbright',
            'nekomario28/ftbpublicclaims',
            'nekomario28/buyclaimchunks',
            'nekomario28/freetoken',
            'nekomario28/offhandcombat',
            'nekomario28/gz-sim',
            'nekomario28/turing-smart-screen-python-owl',
          ]);
          const expectedAvailable = new Set([
            'nekomario28/interactive-project-map',
            'nekomario28/projexd_group10',
            'nekomario28/antifullbright',
            'nekomario28/ftbpublicclaims',
            'nekomario28/buyclaimchunks',
            'nekomario28/freetoken',
            'nekomario28/offhandcombat',
            'nekomario28/turing-smart-screen-python-owl',
          ]);
          const expectedSnapshotDates = ['2026-07-25', '2026-08-04', '2026-08-24', '2026-08-25'];
          const expectedAvailableSnapshotDate = new Map([
            ['nekomario28/interactive-project-map', '2026-08-25'],
            ['nekomario28/projexd_group10', '2026-08-25'],
            ['nekomario28/antifullbright', '2026-08-25'],
            ['nekomario28/ftbpublicclaims', '2026-08-25'],
            ['nekomario28/buyclaimchunks', '2026-07-25'],
            ['nekomario28/freetoken', '2026-08-24'],
            ['nekomario28/offhandcombat', '2026-08-04'],
            ['nekomario28/turing-smart-screen-python-owl', '2026-08-25'],
          ]);
          const available = presentation.repositories.filter((entry) => entry.overlayState === 'available');
          const unavailable = presentation.repositories.filter((entry) => entry.overlayState !== 'available');

          if (assessment.contractId !== 'ipm-repository-assessment-artifact-v1') throw new Error('unexpected assessment contract');
          if (assessment.generatorRevision !== process.env.IPM_QUALITY_TOOLS_REF) throw new Error('assessment generator revision does not match pinned tools ref');
          if (assessment.productionScoring !== false) throw new Error('assessment production scoring must remain disabled');
          if (assessment.repositories.some((entry) => entry.productionScore !== null)) throw new Error('repository production score leaked into sidecar');
          if (presentation.presentationId !== 'ipm-repository-quality-presentation-v1') throw new Error('unexpected presentation contract');
          if (presentation.status !== 'experimental-non-default') throw new Error('Quality presentation is no longer non-default');
          if (presentation.source?.graphGeneratedAt !== graph.generatedAt) throw new Error('presentation graphGeneratedAt does not match graph');
          if (presentation.invariants?.rendererDoesNotInferQuality !== true) throw new Error('renderer authority invariant missing');
          if (presentation.invariants?.productionRankingAllowed !== false) throw new Error('production ranking unexpectedly enabled');
          if (diagnostics.candidateId !== 'ipm-live-quality-sidecars-v1') throw new Error('unexpected sidecar diagnostics contract');
          if (diagnostics.sourceGraph?.generatedAt !== graph.generatedAt) throw new Error('diagnostics graphGeneratedAt does not match graph');
          if (diagnostics.sourceGraph?.repositoryNodeCount !== graphRepositories.length) throw new Error('diagnostics repository-node count mismatch');
          if (diagnostics.generatorRevision !== process.env.IPM_QUALITY_TOOLS_REF) throw new Error('diagnostics generator revision does not match pinned tools ref');
          if (diagnostics.expectedPresentationAvailable !== expectedAvailable.size) throw new Error('manifest presentation-available expectation mismatch');
          if (diagnostics.enrichmentSources?.length !== expectedAssessmentSources.size) throw new Error('bounded assessment source count mismatch');
          if (diagnostics.assessment?.quality?.applied !== expectedAssessmentSources.size) throw new Error('bounded assessment enrichment count mismatch');
          if (!diagnostics.enrichmentSources.every((entry) => validSnapshotDate(entry.fixtureSnapshotDate))) throw new Error('bounded assessment source has invalid frozen snapshot date');
          if (diagnostics.invariants?.forkQualityUsesProvenanceAwareBundle !== true) throw new Error('fork provenance bundle invariant missing');
          if (diagnostics.invariants?.forkPortfolioQualityUsesLocalDeltaOnly !== true) throw new Error('fork local-delta presentation invariant missing');
          if (diagnostics.invariants?.frozenEvidenceFreshnessIsPublished !== true) throw new Error('frozen evidence freshness invariant missing');
          if (diagnostics.invariants?.automaticEvidenceRefreshPerformed !== false) throw new Error('automatic evidence refresh must remain disabled');
          if (diagnostics.invariants?.presentationFreshnessUsesPresentationEligibleSourcesOnly !== true) throw new Error('presentation freshness scope invariant missing');
          if (diagnostics.invariants?.publicationPerformed !== false) throw new Error('generator must not claim publication authority');
          if (diagnostics.invariants?.defaultActionChanged !== false) throw new Error('generator must not claim default Action changes');

          if (graphIds.size !== graphRepositories.length) throw new Error('duplicate graph repository ids');
          if (assessmentIds.size !== graphIds.size || presentationIds.size !== graphIds.size) throw new Error('sidecar repository count mismatch');
          for (const id of graphIds) {
            if (!assessmentIds.has(id) || !presentationIds.has(id)) throw new Error(`sidecar missing graph repository: ${id}`);
          }
          for (const id of assessmentIds) if (!graphIds.has(id)) throw new Error(`assessment orphan repository: ${id}`);
          for (const id of presentationIds) if (!graphIds.has(id)) throw new Error(`presentation orphan repository: ${id}`);

          const sourceByKey = new Map(diagnostics.enrichmentSources.map((entry) => [normalizeKey(entry.repositoryKey), entry]));
          if (sourceByKey.size !== expectedAssessmentSources.size) throw new Error('duplicate bounded assessment source keys');
          for (const key of expectedAssessmentSources) if (!sourceByKey.has(key)) throw new Error(`expected assessment source missing: ${key}`);

          if (available.length !== expectedAvailable.size) throw new Error(`Quality available count mismatch: ${available.length}`);
          if (unavailable.length !== graphRepositories.length - expectedAvailable.size) throw new Error(`Quality unavailable count mismatch: ${unavailable.length}`);
          const availableByKey = new Map(available.map((entry) => [normalizeKey(entry.repositoryKey), entry]));
          for (const key of expectedAvailable) if (!availableByKey.has(key)) throw new Error(`expected Quality presentation missing: ${key}`);

          const assessmentFreshness = diagnostics.evidenceFreshness?.assessment;
          const presentationFreshness = diagnostics.evidenceFreshness?.portfolioPresentation;
          if (assessmentFreshness?.mode !== 'bounded-frozen-snapshots' || assessmentFreshness.scope !== 'all-bounded-assessment-sources') throw new Error('assessment freshness contract mismatch');
          if (assessmentFreshness.automaticRefresh !== false || assessmentFreshness.sourceCount !== expectedAssessmentSources.size) throw new Error('assessment freshness cardinality/refresh mismatch');
          if (!assessmentFreshness.snapshotDates?.every(validSnapshotDate)) throw new Error('assessment freshness contains invalid snapshot date');
          if (JSON.stringify(assessmentFreshness.snapshotDates) !== JSON.stringify(expectedSnapshotDates)) throw new Error('assessment freshness snapshot dates mismatch');
          if (assessmentFreshness.oldestSnapshotDate !== '2026-07-25' || assessmentFreshness.newestSnapshotDate !== '2026-08-25') throw new Error('assessment freshness range mismatch');
          if (presentationFreshness?.mode !== 'bounded-frozen-snapshots' || presentationFreshness.scope !== 'portfolio-quality-presented-sources') throw new Error('presentation freshness contract mismatch');
          if (presentationFreshness.automaticRefresh !== false || presentationFreshness.sourceCount !== expectedAvailable.size) throw new Error('presentation freshness cardinality/refresh mismatch');
          if (!presentationFreshness.snapshotDates?.every(validSnapshotDate)) throw new Error('presentation freshness contains invalid snapshot date');
          if (JSON.stringify(presentationFreshness.snapshotDates) !== JSON.stringify(expectedSnapshotDates)) throw new Error('presentation freshness snapshot dates mismatch');
          if (presentationFreshness.oldestSnapshotDate !== '2026-07-25' || presentationFreshness.newestSnapshotDate !== '2026-08-25') throw new Error('presentation freshness range mismatch');
          if (JSON.stringify(presentation.evidenceFreshness) !== JSON.stringify(presentationFreshness)) throw new Error('published presentation freshness diverges from diagnostics');

          for (const entry of available) {
            const key = normalizeKey(entry.repositoryKey);
            const expectedDate = expectedAvailableSnapshotDate.get(key);
            if (!expectedDate) throw new Error(`available Quality source is not explicitly freshness-bound: ${entry.repositoryKey}`);
            if (entry.evidenceFreshness?.state !== 'frozen-snapshot') throw new Error(`available Quality freshness state missing: ${entry.repositoryKey}`);
            if (!validSnapshotDate(entry.evidenceFreshness?.snapshotDate)) throw new Error(`available Quality snapshot date invalid: ${entry.repositoryKey}`);
            if (entry.evidenceFreshness?.snapshotDate !== expectedDate) throw new Error(`available Quality snapshot date mismatch: ${entry.repositoryKey}`);
            if (entry.evidenceFreshness?.automaticRefresh !== false) throw new Error(`available Quality automatic refresh unexpectedly enabled: ${entry.repositoryKey}`);
          }
          if (unavailable.some((entry) => entry.evidenceFreshness != null)) throw new Error('unavailable repository must not receive portfolio evidence freshness');

          const antifullbrightSource = sourceByKey.get('nekomario28/antifullbright');
          const antifullbright = availableByKey.get('nekomario28/antifullbright');
          if (antifullbrightSource?.mode !== 'repository-snapshot' || antifullbrightSource?.qualityAttributionScope !== 'repository-snapshot') throw new Error('AntiFullbright assessment source lost repository-snapshot attribution');
          if (antifullbrightSource?.presentationExpected !== 'available' || antifullbrightSource?.fixtureSnapshotDate !== '2026-08-25') throw new Error('AntiFullbright source freshness/presentation expectation mismatch');
          if (antifullbright?.qualityAttributionScope !== 'repository-snapshot' || antifullbright?.overlayState !== 'available') throw new Error('AntiFullbright presentation scope/state mismatch');
          if (antifullbright?.overlay?.coverage?.targetDimensions !== 6 || antifullbright?.overlay?.coverage?.inspectedDimensions !== 5) throw new Error('AntiFullbright target coverage mismatch');
          if (antifullbright?.overlay?.targetFindingCounts?.supports !== 5 || antifullbright?.overlay?.targetFindingCounts?.unknown !== 1) throw new Error('AntiFullbright finding distribution mismatch');
          const antifullbrightMaintainability = antifullbright?.overlay?.segments?.find((segment) => segment.id === 'maintainability');
          const antifullbrightSecurity = antifullbright?.overlay?.segments?.find((segment) => segment.id === 'security-safety');
          if (antifullbrightMaintainability?.findingState !== 'unknown') throw new Error('AntiFullbright Maintainability must remain unknown');
          if (antifullbrightSecurity?.applicability !== 'optional' || antifullbrightSecurity?.findingState !== 'supports') throw new Error('AntiFullbright optional Security/Safety contract mismatch');

          const ftbSource = sourceByKey.get('nekomario28/ftbpublicclaims');
          const ftb = availableByKey.get('nekomario28/ftbpublicclaims');
          if (ftbSource?.mode !== 'repository-snapshot' || ftbSource?.qualityAttributionScope !== 'repository-snapshot') throw new Error('FTBPublicClaims source lost default-snapshot attribution');
          if (ftbSource?.presentationExpected !== 'available' || ftbSource?.fixtureSnapshotDate !== '2026-08-25') throw new Error('FTBPublicClaims source freshness/presentation expectation mismatch');
          if (ftbSource?.calibratedRevision !== '8caaab65266a94e7bdedc6ad2f66030c7e394edf') throw new Error('FTBPublicClaims calibrated default revision mismatch');
          if (ftb?.qualityAttributionScope !== 'repository-snapshot' || ftb?.overlayState !== 'available') throw new Error('FTBPublicClaims presentation scope/state mismatch');
          if (ftb?.overlay?.coverage?.targetDimensions !== 6 || ftb?.overlay?.coverage?.inspectedDimensions !== 5) throw new Error('FTBPublicClaims target coverage mismatch');
          if (ftb?.overlay?.targetFindingCounts?.supports !== 5 || ftb?.overlay?.targetFindingCounts?.unknown !== 1) throw new Error('FTBPublicClaims finding distribution mismatch');
          const ftbVerification = ftb?.overlay?.segments?.find((segment) => segment.id === 'verification');
          const ftbMaintainability = ftb?.overlay?.segments?.find((segment) => segment.id === 'maintainability');
          const ftbSecurity = ftb?.overlay?.segments?.find((segment) => segment.id === 'security-safety');
          if (ftbVerification?.findingState !== 'unknown') throw new Error('FTBPublicClaims Verification must remain unknown');
          if (ftbMaintainability?.findingState !== 'supports') throw new Error('FTBPublicClaims Maintainability must remain supports');
          if (ftbSecurity?.applicability !== 'optional' || ftbSecurity?.findingState !== 'supports') throw new Error('FTBPublicClaims optional Security/Safety contract mismatch');
          if (ftb?.evidenceFreshness?.snapshotDate !== '2026-08-25') throw new Error('FTBPublicClaims evidence freshness mismatch');

          const buyClaimSource = sourceByKey.get('nekomario28/buyclaimchunks');
          const buyClaim = availableByKey.get('nekomario28/buyclaimchunks');
          if (buyClaimSource?.mode !== 'fork-local-delta' || buyClaimSource?.qualityAttributionScope !== 'local-delta') throw new Error('BuyClaimChunks assessment source lost fork local-delta attribution');
          if (buyClaimSource?.presentationExpected !== 'available' || buyClaimSource?.fixtureSnapshotDate !== '2026-07-25') throw new Error('BuyClaimChunks source freshness/presentation expectation mismatch');
          if (buyClaimSource?.calibratedRevision !== '22d7adcbe5f711a3bc7e2cb8593c60e19838dce1') throw new Error('BuyClaimChunks calibrated default-main revision mismatch');
          if (buyClaim?.qualityAttributionScope !== 'local-delta' || buyClaim?.overlayState !== 'available') throw new Error('BuyClaimChunks presentation scope/state mismatch');
          if (buyClaim?.overlay?.coverage?.targetDimensions !== 6 || buyClaim?.overlay?.coverage?.inspectedDimensions !== 5) throw new Error('BuyClaimChunks target coverage mismatch');
          if (buyClaim?.overlay?.targetFindingCounts?.supports !== 5 || buyClaim?.overlay?.targetFindingCounts?.unknown !== 1) throw new Error('BuyClaimChunks finding distribution mismatch');
          const buyClaimMaintainability = buyClaim?.overlay?.segments?.find((segment) => segment.id === 'maintainability');
          const buyClaimSecurity = buyClaim?.overlay?.segments?.find((segment) => segment.id === 'security-safety');
          if (buyClaimMaintainability?.findingState !== 'unknown') throw new Error('BuyClaimChunks Maintainability must remain unknown');
          if (buyClaimSecurity?.applicability !== 'optional' || buyClaimSecurity?.findingState !== 'supports') throw new Error('BuyClaimChunks optional Security/Safety contract mismatch');
          if (buyClaim?.evidenceFreshness?.snapshotDate !== '2026-07-25') throw new Error('BuyClaimChunks evidence date was laundered to publication date');

          const freeTokenSource = sourceByKey.get('nekomario28/freetoken');
          const freeToken = availableByKey.get('nekomario28/freetoken');
          if (freeTokenSource?.mode !== 'fork-local-delta' || freeTokenSource?.qualityAttributionScope !== 'local-delta') throw new Error('FreeToken assessment source lost fork local-delta attribution');
          if (freeTokenSource?.presentationExpected !== 'available' || freeTokenSource?.fixtureSnapshotDate !== '2026-08-24') throw new Error('FreeToken source freshness/presentation expectation mismatch');
          if (freeTokenSource?.calibratedRevision !== 'b2c0f162ae74c22898fb61b7369b4d7a3474bbfa') throw new Error('FreeToken calibrated default-main revision mismatch');
          if (freeToken?.qualityAttributionScope !== 'local-delta' || freeToken?.overlayState !== 'available') throw new Error('FreeToken presentation scope/state mismatch');
          if (freeToken?.overlay?.coverage?.targetDimensions !== 6 || freeToken?.overlay?.coverage?.inspectedDimensions !== 3) throw new Error('FreeToken target coverage mismatch');
          if (freeToken?.overlay?.targetFindingCounts?.supports !== 3 || freeToken?.overlay?.targetFindingCounts?.unknown !== 3) throw new Error('FreeToken finding distribution mismatch');
          const freeTokenMaintainability = freeToken?.overlay?.segments?.find((segment) => segment.id === 'maintainability');
          const freeTokenSecurity = freeToken?.overlay?.segments?.find((segment) => segment.id === 'security-safety');
          const freeTokenStewardship = freeToken?.overlay?.segments?.find((segment) => segment.id === 'stewardship');
          if (freeTokenMaintainability?.findingState !== 'unknown') throw new Error('FreeToken Maintainability must remain unknown');
          if (freeTokenSecurity?.findingState !== 'unknown') throw new Error('FreeToken Security/Safety must remain unknown');
          if (freeTokenStewardship?.findingState !== 'unknown') throw new Error('FreeToken Stewardship must remain unknown');
          if (freeToken?.evidenceFreshness?.snapshotDate !== '2026-08-24') throw new Error('FreeToken evidence date was laundered to publication date');

          const offhandSource = sourceByKey.get('nekomario28/offhandcombat');
          const offhand = availableByKey.get('nekomario28/offhandcombat');
          if (offhandSource?.mode !== 'fork-local-delta' || offhandSource?.qualityAttributionScope !== 'local-delta') throw new Error('OffHandCombat assessment source lost fork local-delta attribution');
          if (offhandSource?.presentationExpected !== 'available' || offhandSource?.fixtureSnapshotDate !== '2026-08-04') throw new Error('OffHandCombat source freshness/presentation expectation mismatch');
          if (offhandSource?.calibratedRevision !== '317c2ec2e40325d8dd41f6dc5e730e95c97ae7e1') throw new Error('OffHandCombat calibrated default-master revision mismatch');
          if (offhand?.qualityAttributionScope !== 'local-delta' || offhand?.overlayState !== 'available') throw new Error('OffHandCombat presentation scope/state mismatch');
          if (offhand?.overlay?.coverage?.targetDimensions !== 6 || offhand?.overlay?.coverage?.inspectedDimensions !== 5) throw new Error('OffHandCombat target coverage mismatch');
          if (offhand?.overlay?.targetFindingCounts?.supports !== 5 || offhand?.overlay?.targetFindingCounts?.unknown !== 1) throw new Error('OffHandCombat finding distribution mismatch');
          const offhandMaintainability = offhand?.overlay?.segments?.find((segment) => segment.id === 'maintainability');
          const offhandSecurity = offhand?.overlay?.segments?.find((segment) => segment.id === 'security-safety');
          if (offhandMaintainability?.findingState !== 'unknown') throw new Error('OffHandCombat Maintainability must remain unknown');
          if (offhandSecurity?.applicability !== 'optional' || offhandSecurity?.findingState !== 'supports') throw new Error('OffHandCombat optional Security/Safety contract mismatch');
          if (offhand?.evidenceFreshness?.snapshotDate !== '2026-08-04') throw new Error('OffHandCombat evidence date was laundered to publication date');

          const gzSource = sourceByKey.get('nekomario28/gz-sim');
          const gzPresentation = presentation.repositories.find((entry) => normalizeKey(entry.repositoryKey) === 'nekomario28/gz-sim');
          if (gzSource?.mode !== 'fork-local-delta' || gzSource?.qualityAttributionScope !== 'local-delta') throw new Error('gz-sim assessment source lost fork local-delta attribution');
          if (gzSource?.presentationExpected !== 'unavailable' || gzSource?.fixtureSnapshotDate !== '2026-08-25') throw new Error('gz-sim source freshness/presentation expectation mismatch');
          if (gzPresentation?.qualityAttributionScope !== 'local-delta') throw new Error('gz-sim presentation attribution scope mismatch');
          if (gzPresentation?.overlayState !== 'unavailable' || gzPresentation?.unavailableReason !== 'no-local-delta-observed-in-comparison-scope') throw new Error('gz-sim attribution-safe unavailability mismatch');

          const turing = availableByKey.get('nekomario28/turing-smart-screen-python-owl');
          if (turing?.qualityAttributionScope !== 'local-delta') throw new Error('turing presentation must remain local-delta Quality');
          const turingStewardship = turing?.views?.detail?.segments?.find((segment) => segment.id === 'stewardship');
          if (!turingStewardship || turingStewardship.findingState !== 'unknown') throw new Error('inherited turing stewardship leaked into local-delta Quality');

          for (const key of ['nekomario28/interactive-project-map', 'nekomario28/projexd_group10', 'nekomario28/antifullbright', 'nekomario28/ftbpublicclaims']) {
            if (availableByKey.get(key)?.qualityAttributionScope !== 'repository-snapshot') throw new Error(`unexpected non-fork Quality scope: ${key}`);
          }

          for (const entry of presentation.repositories) {
            const policy = entry.visualPolicy;
            if (!policy || policy.repositoryCore !== 'inherit-structure-renderer') throw new Error(`invalid repository core policy: ${entry.repositoryKey}`);
            for (const key of ['placementEffect', 'nodeSizeEffect', 'labelPriorityEffect', 'impactHaloEffect']) {
              if (policy[key] !== 'none') throw new Error(`Quality exceeded visual authority for ${entry.repositoryKey}: ${key}`);
            }
          }
          console.log(`Quality sidecars validated: ${graphIds.size} joined; ${available.length} available; ${unavailable.length} unavailable; frozen evidence ${presentationFreshness.oldestSnapshotDate}..${presentationFreshness.newestSnapshotDate}`);
          NODE

      - name: Remove temporary assessment tools
        shell: bash
        run: rm -rf .ipm-quality-tools .quality-sidecars

      - name: Verify generated sidecars on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s project-map/assessment.json
          test -s project-map/quality-presentation.json
          echo "EXPERIMENTAL_QUALITY_SIDECAR_PR_PASS"

      - name: Commit experimental Quality sidecars
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add -- project-map/assessment.json project-map/quality-presentation.json
          if git diff --cached --quiet; then
            echo "Quality sidecars are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update experimental Quality sidecars"
          git push origin HEAD:main