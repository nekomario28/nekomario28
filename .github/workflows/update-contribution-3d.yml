name: Generate 3D contribution comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-contribution-3d.yml"
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-3d-candidate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate 3D contribution candidate
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep only the comparison candidate
        shell: bash
        run: |
          set -euo pipefail
          source_file="profile-3d-contrib/profile-gitblock.svg"
          target_file="assets/contribution-3d-candidate.svg"
          test -s "$source_file"
          grep -q '<svg' "$source_file"
          mkdir -p assets
          cp "$source_file" "$target_file"

      - name: Commit comparison candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-3d-candidate.svg

          if git diff --cached --quiet; then
            echo "3D contribution candidate is already up to date."
            exit 0
          fi

          git commit -m "update 3d contribution candidate"
          git push
