name: Materialize envelope v5 preview

on:
  push:
    branches: [feat/envelope-v5-continuous-flow]
    paths:
      - ".github/workflows/materialize-envelope-v5-preview.yml"
      - "design-lab/scripts/render_continuous_flow.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/theme-manifest.json"

permissions:
  contents: write

concurrency:
  group: envelope-v5-preview-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Render summer continuous-flow preview
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile design-lab/scripts/render_continuous_flow.py
          python design-lab/scripts/render_continuous_flow.py --season summer
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('design-lab/live-theme.json')
          state = json.loads(p.read_text())
          state['version'] = 5
          state['envelope_version'] = 5
          state['frame'] = {
            'mode': 'continuous-segmented-flow',
            'background_illusion': True,
            'shared_edge_rails': True,
            'top_cap': True,
            'bottom_cap': True,
            'phase_tolerant_handoff': True,
            'cross_document_hard_sync': False,
            'true_overlay': False
          }
          state['promotion_mode'] = 'manual-envelope-v5-preview'
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')
          PY
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          specs = {
            'assets/profile-hero.svg': ('900','260','0 0 900 260'),
            'assets/profile-frame-bridge.svg': ('900','32','0 0 900 32'),
            'assets/profile-section-projects.svg': ('900','68','0 0 900 68'),
            'assets/profile-section-activity.svg': ('900','68','0 0 900 68'),
            'assets/profile-footer.svg': ('900','92','0 0 900 92'),
          }
          for rel, geom in specs.items():
              root = ET.parse(rel).getroot()
              assert (root.attrib['width'], root.attrib['height'], root.attrib['viewBox']) == geom
              text = Path(rel).read_text()
              assert 'id="v5-frame"' in text
              assert 'prefers-reduced-motion' in text
              assert '<script' not in text.lower()
          PY
      - name: Commit exact preview output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-hero.svg assets/profile-frame-bridge.svg assets/profile-section-projects.svg assets/profile-section-activity.svg assets/profile-footer.svg design-lab/live-theme.json
          if git diff --cached --quiet; then
            echo "Envelope v5 preview already materialized."
            exit 0
          fi
          git commit -m "materialize envelope v5 summer preview"
          git push
