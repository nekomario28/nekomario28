name: Materialize Envelope v6 preview once

on:
  push:
    branches: [feat/envelope-v6-global-motion-space]
    paths:
      - ".github/workflows/materialize-envelope-v6-preview.yml"
      - "design-lab/theme-manifest.json"
      - "design-lab/envelope-v6/**"
      - "design-lab/scripts/promote-season.py"
      - "design-lab/scripts/render_global_motion.py"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/seasons/*.svg"

permissions:
  contents: write

concurrency:
  group: envelope-v6-preview-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: feat/envelope-v6-global-motion-space
          fetch-depth: 1

      - name: Generate Summer v6 stable assets and state
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            design-lab/scripts/promote-season.py \
            design-lab/scripts/render_global_motion.py \
            design-lab/scripts/render_envelope_chrome.py
          python design-lab/scripts/promote-season.py --season summer --apply --json

      - name: Commit generated preview only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/profile-hero.svg \
            assets/profile-frame-bridge-character-projects.svg \
            assets/profile-section-projects.svg \
            assets/profile-frame-bridge-projects-activity.svg \
            assets/profile-section-activity.svg \
            assets/profile-frame-bridge-activity-footer.svg \
            assets/profile-footer.svg \
            design-lab/live-theme.json
          if git diff --cached --quiet; then
            echo "Envelope v6 Summer preview already materialized."
            exit 0
          fi
          git commit -m "Materialize Summer Envelope v6 preview"
          git push origin HEAD:feat/envelope-v6-global-motion-space
