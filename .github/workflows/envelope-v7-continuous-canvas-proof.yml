name: Envelope v7 continuous canvas proof

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "design-lab/envelope-v7/**"
      - ".github/workflows/envelope-v7-continuous-canvas-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install proof helpers
        run: python -m pip install --quiet websocket-client pillow

      - name: Capture branch README and validate single-stage panels
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          out="$RUNNER_TEMP/envelope-v7-proof"
          profile="$RUNNER_TEMP/envelope-v7-chrome-profile"
          rm -rf "$out" "$profile"
          mkdir -p "$out" "$profile"
          export OUT="$out"

          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --user-data-dir="$profile" \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --window-size=1440,3400 about:blank >"$out/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:9222/json/list >"$out/targets.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then
              break
            fi
            sleep .2
          done
          if test "$ready" != 1; then
            echo "Chrome failed to expose CDP" >&2
            cat "$out/chrome.log" >&2 || true
            exit 1
          fi

          python - <<'PY'
          import base64, json, os, time
          from pathlib import Path
          import websocket
          from PIL import Image, ImageStat

          out = Path(os.environ['OUT'])
          head = os.environ['HEAD_SHA']
          target_url = f'https://github.com/nekomario28/nekomario28/tree/{head}'
          targets = json.loads((out / 'targets.json').read_text())
          target = next(t for t in targets if t.get('type') == 'page')
          ws = websocket.create_connection(target['webSocketDebuggerUrl'], timeout=20)
          seq = 0

          def call(method, params=None):
              global seq
              seq += 1
              ident = seq
              ws.send(json.dumps({'id': ident, 'method': method, 'params': params or {}}))
              while True:
                  msg = json.loads(ws.recv())
                  if msg.get('id') == ident:
                      if 'error' in msg:
                          raise RuntimeError(f"CDP {method}: {msg['error']}")
                      return msg.get('result', {})

          def evaluate(expr):
              return call('Runtime.evaluate', {'expression': expr, 'returnByValue': True, 'awaitPromise': True}).get('result', {}).get('value')

          def wait_ready(timeout=20):
              end = time.time() + timeout
              while time.time() < end:
                  state = evaluate("""(() => ({ready:document.readyState, imgs:Array.from(document.images).every(i=>i.complete)}))()""")
                  if state and state['ready'] == 'complete' and state['imgs']:
                      return
                  time.sleep(.2)
              raise RuntimeError('page/images did not become ready')

          def capture(name, clip=None):
              params = {'format':'png','captureBeyondViewport': bool(clip)}
              if clip:
                  params['clip'] = {**clip, 'scale': 1}
              data = call('Page.captureScreenshot', params)['data']
              (out / name).write_bytes(base64.b64decode(data))

          tokens = [
              'profile-hero.svg',
              'character-panel.svg',
              'attribution-band.svg',
              'profile-frame-bridge-character-projects.svg',
              'profile-section-projects.svg',
              'projects-panel.svg',
              'profile-frame-bridge-projects-activity.svg',
              'profile-section-activity.svg',
              'activity-panel.svg',
              'profile-frame-bridge-activity-footer.svg',
              'profile-footer.svg',
          ]

          def metrics(label):
              script = f'''(() => {{
                const tokens = {json.dumps(tokens)};
                const imgs = Array.from(document.images);
                const rect = i => {{ if(!i) return null; const r=i.getBoundingClientRect(); return {{src:i.src,x:r.x,y:r.y,w:r.width,h:r.height,b:r.bottom,right:r.right,nw:i.naturalWidth,nh:i.naturalHeight}}; }};
                const out = {{}};
                for (const token of tokens) out[token] = rect(imgs.find(i => i.src.includes(token)));
                const container = document.querySelector('article.markdown-body') || document.querySelector('.markdown-body');
                out.container = container ? (() => {{ const r=container.getBoundingClientRect(); return {{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right}}; }})() : null;
                out.viewport = {{w:innerWidth,h:innerHeight,dpr:devicePixelRatio}};
                return out;
              }})()'''
              m = evaluate(script)
              (out / f'{label}-metrics.json').write_text(json.dumps(m, indent=2))
              return m

          def assert_layout(m, label):
              missing = [t for t in tokens if not m.get(t)]
              if missing:
                  raise RuntimeError(f'{label}: missing stage images: {missing}')
              failed = [t for t in tokens if m[t]['nw'] <= 0 or m[t]['nh'] <= 0]
              if failed:
                  raise RuntimeError(f'{label}: failed stage image loads: {failed}')
              hero_w = m['profile-hero.svg']['w']
              full = [t for t in tokens if t not in {
                  'profile-frame-bridge-character-projects.svg',
                  'profile-frame-bridge-projects-activity.svg',
                  'profile-frame-bridge-activity-footer.svg'}]
              for t in full:
                  if abs(m[t]['w'] - hero_w) > 3:
                      raise RuntimeError(f'{label}: {t} width {m[t]["w"]} differs from hero {hero_w}')
              if m.get('container'):
                  left = m['container']['x'] - 2
                  right = m['container']['right'] + 2
                  for t in tokens:
                      if m[t]['x'] < left or m[t]['right'] > right:
                          raise RuntimeError(f'{label}: {t} overflows README container: {m[t]} vs {m["container"]}')
              ordered = [m[t] for t in tokens]
              gaps = [ordered[i+1]['y'] - ordered[i]['b'] for i in range(len(ordered)-1)]
              m['inter_stage_gaps'] = gaps
              if max(gaps) > 10:
                  raise RuntimeError(f'{label}: excessive vertical stage gap: {gaps}')

          def panel_stats(name, center_fraction):
              im = Image.open(out / name).convert('RGB')
              w,h = im.size
              x0,x1 = int(w*center_fraction[0]), int(w*center_fraction[1])
              crop = im.crop((x0, 0, x1, h))
              stat = ImageStat.Stat(crop)
              return {
                  'size':[w,h],
                  'center_box':[x0,0,x1,h],
                  'center_mean':[round(v,2) for v in stat.mean],
                  'center_stddev':[round(v,2) for v in stat.stddev],
                  'center_extrema':[list(v) for v in stat.extrema],
              }

          call('Page.enable'); call('Runtime.enable')
          call('Emulation.setEmulatedMedia', {'features':[{'name':'prefers-color-scheme','value':'dark'}]})

          call('Emulation.setDeviceMetricsOverride', {'width':1440,'height':3400,'deviceScaleFactor':1,'mobile':False})
          call('Page.navigate', {'url':target_url}); wait_ready(); time.sleep(1.0)
          desktop = metrics('desktop'); assert_layout(desktop, 'desktop'); capture('desktop-dark.png')
          for token, name in [('character-panel.svg','character-panel-render.png'),('projects-panel.svg','projects-panel-render.png'),('activity-panel.svg','activity-panel-render.png')]:
              r = desktop[token]
              capture(name, {'x':r['x'],'y':r['y'],'width':r['w'],'height':r['h']})
          stats = {
              'character': panel_stats('character-panel-render.png',(100/900,800/900)),
              'projects': panel_stats('projects-panel-render.png',(80/900,820/900)),
              'activity': panel_stats('activity-panel-render.png',(70/900,830/900)),
          }
          (out / 'panel-stats.json').write_text(json.dumps(stats, indent=2))

          call('Emulation.setDeviceMetricsOverride', {'width':430,'height':3400,'deviceScaleFactor':1,'mobile':True})
          time.sleep(1.0)
          mobile = metrics('mobile'); assert_layout(mobile, 'mobile'); capture('mobile-dark.png')

          summary = {'target':target_url,'desktop':desktop,'mobile':mobile,'panel_stats':stats,'result':'PASS'}
          (out / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envelope-v7-continuous-canvas-proof
          path: |
            ${{ runner.temp }}/envelope-v7-proof/*.png
            ${{ runner.temp }}/envelope-v7-proof/*.json
            ${{ runner.temp }}/envelope-v7-proof/chrome.log
          if-no-files-found: error
          retention-days: 1
