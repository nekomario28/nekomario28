name: OpenArm kinematics current numerical revalidation

on:
  push:
    branches:
      - research/openarm-kinematics-current-numerical-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_SHA: 5d79eb5ecf6b3654ef34c8222fb27b24cea182cb
      CONTROL_SHA: 8462f93547972cd9af2910bd7263d7127231b6db
      CONTROL_FIX_SHA: cd37da57bb27738dd5bd9758f658d6f287506f46

    steps:
      - name: Create exact detached checkouts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/openarm-kin-current-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RR="$ROOT/rust"
          CTRL="$ROOT/openarm_control"
          FIX="$ROOT/openarm_control_fix"
          mkdir -p "$ROOT"
          clone_exact() {
            local url="$1" sha="$2" dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "$url"
            git -C "$dest" fetch -q --depth=1 origin "$sha"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          }
          clone_exact https://github.com/k1000dai/dora-openarm-kinematics-rust.git "$RUST_SHA" "$RR"
          clone_exact https://github.com/enactic/openarm_control.git "$CONTROL_SHA" "$CTRL"
          clone_exact https://github.com/enactic/openarm_control.git "$CONTROL_FIX_SHA" "$FIX"
          printf 'ROOT=%s\nRR=%s\nCTRL=%s\nFIX=%s\n' "$ROOT" "$RR" "$CTRL" "$FIX" >> "$GITHUB_ENV"
          echo "EXACT_AUTHORITIES_PASS rust=$RUST_SHA control=$CONTROL_SHA fix=$CONTROL_FIX_SHA"

      - name: Build isolated provider environments
        shell: bash
        run: |
          set -euo pipefail
          make_env() {
            local envdir="$1" src="$2"
            python3 -m venv "$envdir"
            "$envdir/bin/python" -m pip install -q --upgrade pip
            "$envdir/bin/python" -m pip install -q -e "$src"
          }
          make_env "$ROOT/venv-main312" "$CTRL"
          make_env "$ROOT/venv-main310" "$CTRL"
          "$ROOT/venv-main310/bin/python" -m pip install -q 'mujoco==3.10.0'
          make_env "$ROOT/venv-fix312" "$FIX"
          for env in main312 main310 fix312; do
            "$ROOT/venv-$env/bin/python" - <<'PY'
          import importlib.metadata as md
          from openarm_control import IKParams
          print('ENV', md.version('openarm-control'), 'mujoco', md.version('mujoco'), 'openarm-mujoco', md.version('openarm-mujoco'))
          print('DEFAULTS', IKParams())
          PY
          done

      - name: Reproduce current real-model IK initialization regression and proposed fix
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1" py="$2" expected="$3"
            set +e
            "$py" - <<'PY' >"$ROOT/probe-$label.log" 2>&1
          import argparse, mujoco
          from openarm_control import IKParams, Kinematics, register_common_args, setup_from_args
          p = argparse.ArgumentParser()
          register_common_args(p)
          setup = setup_from_args(p.parse_args([]))
          selected = {int(i) for side in setup.sides for i in setup.joint_resolver.arm_qpos_indices(side)}
          for jid in range(setup.model.njnt):
              qadr = int(setup.model.jnt_qposadr[jid])
              if setup.model.jnt_limited[jid] and qadr in selected:
                  name = mujoco.mj_id2name(setup.model, mujoco.mjtObj.mjOBJ_JOINT, jid)
                  print('SELECTED_LIMITED', jid, name, qadr, int(setup.model.jnt_type[jid]), type(setup.model.jnt_type[jid]).__name__)
          Kinematics(setup, IKParams())
          print('REAL_MODEL_IK_INIT_PASS')
          PY
            rc=$?
            set -e
            echo "REAL_MODEL_INIT_RESULT label=$label rc=$rc expected=$expected"
            cat "$ROOT/probe-$label.log"
            if [ "$expected" = fail ]; then test "$rc" -ne 0; else test "$rc" -eq 0; fi
          }
          probe main-mujoco312 "$ROOT/venv-main312/bin/python" fail
          probe main-mujoco310 "$ROOT/venv-main310/bin/python" pass
          probe pr25-mujoco312 "$ROOT/venv-fix312/bin/python" pass
          echo 'MUJOCO_ENUM_CAUSAL_ISOLATION_PASS'

      - name: Regenerate fixtures with current main under compatible MuJoCo 3.10
        shell: bash
        run: |
          set -euo pipefail
          cd "$RR"
          rm -rf /tmp/openarm_kin_golden
          "$ROOT/venv-main310/bin/python" dev/gen_fixtures.py | tee "$ROOT/current-main310-generator.log"
          mkdir -p "$ROOT/current-main310"
          cp /tmp/openarm_kin_golden/fixtures/*.json "$ROOT/current-main310/"
          echo 'CURRENT_MAIN310_FIXTURE_GENERATION_PASS'

      - name: Regenerate fixtures with PR25 fix under MuJoCo 3.12
        shell: bash
        run: |
          set -euo pipefail
          cd "$RR"
          rm -rf /tmp/openarm_kin_golden
          "$ROOT/venv-fix312/bin/python" dev/gen_fixtures.py | tee "$ROOT/current-fix312-generator.log"
          mkdir -p "$ROOT/current-fix312"
          cp /tmp/openarm_kin_golden/fixtures/*.json "$ROOT/current-fix312/"
          echo 'CURRENT_FIX312_FIXTURE_GENERATION_PASS'

      - name: Generate legacy-overlap provider profile on fixed current provider
        shell: bash
        run: |
          set -euo pipefail
          cd "$RR"
          cp dev/gen_fixtures.py "$ROOT/gen_fixtures_legacy_overlap.py"
          GEN="$ROOT/gen_fixtures_legacy_overlap.py" "$ROOT/venv-fix312/bin/python" - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['GEN'])
          s = p.read_text()
          needle = '        args = parser_with_defaults(extra_args)\n'
          replacement = '''        provider_args = list(extra_args) + [\n            "--pos-cost", "1.0",\n            "--ori-cost", "1.0",\n            "--frame-position-error-limit", "0",\n            "--frame-orientation-error-limit", "0",\n            "--nullspace-cost", "0",\n            "--singularity-max-approach-rate", "0",\n            "--kinetic-energy-cost", "0",\n            "--no-joint-braking",\n        ]\n        args = parser_with_defaults(provider_args)\n'''
          if s.count(needle) != 1:
              raise SystemExit(f'expected one run_case parser site, found {s.count(needle)}')
          p.write_text(s.replace(needle, replacement))
          print('LEGACY_PROFILE_PATCH_PASS')
          PY
          rm -rf /tmp/openarm_kin_golden
          "$ROOT/venv-fix312/bin/python" "$ROOT/gen_fixtures_legacy_overlap.py" | tee "$ROOT/legacy-generator.log"
          mkdir -p "$ROOT/legacy-overlap"
          cp /tmp/openarm_kin_golden/fixtures/*.json "$ROOT/legacy-overlap/"
          echo 'LEGACY_OVERLAP_FIXTURE_GENERATION_PASS'

      - name: Quantify provider output drift
        shell: bash
        run: |
          set -euo pipefail
          RR="$RR" ROOT="$ROOT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          rr = Path(os.environ['RR']); root = Path(os.environ['ROOT'])
          old = json.loads((rr/'tests/golden/ik_cases.json').read_text())
          by_old = {c['name']: c for c in old}
          def compare(label, path):
              new = json.loads(path.read_text())
              max_abs = 0.0; worst = None; compared = 0; none_mismatch = []
              for c in new:
                  o = by_old[c['name']]; a, b = o.get('result'), c.get('result')
                  if (a is None) != (b is None): none_mismatch.append(c['name']); continue
                  if a is None: continue
                  diff = max(abs(float(x)-float(y)) for x,y in zip(a,b))
                  compared += 1
                  if diff > max_abs: max_abs, worst = diff, c['name']
              print(f'PROVIDER_DRIFT label={label} compared={compared} max_abs={max_abs:.9g} worst={worst} none_mismatch={none_mismatch}')
          compare('current-main310', root/'current-main310/ik_cases.json')
          compare('current-fix312', root/'current-fix312/ik_cases.json')
          compare('legacy-overlap', root/'legacy-overlap/ik_cases.json')
          # Check whether PR25's enum-only fix changes generated semantics relative to current main under 3.10.
          a = json.loads((root/'current-main310/ik_cases.json').read_text())
          b = json.loads((root/'current-fix312/ik_cases.json').read_text())
          print('FIX_CROSS_VERSION_FIXTURES_IDENTICAL', a == b)
          PY

      - name: Execute Rust golden tests against regenerated provider fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd "$RR"
          mkdir -p "$ROOT/historical"
          cp tests/golden/*.json "$ROOT/historical/"
          run_case() {
            local label="$1" testname="$2" logfile="$3"
            set +e
            cargo test --locked --test golden "$testname" -- --exact --nocapture >"$logfile" 2>&1
            local rc=$?
            set -e
            echo "RUST_GOLDEN_RESULT label=$label test=$testname rc=$rc"
            if [ "$rc" -ne 0 ]; then tail -n 80 "$logfile"; fi
          }
          cp "$ROOT/current-fix312/model_structure.json" tests/golden/model_structure.json
          cp "$ROOT/current-fix312/fk_cases.json" tests/golden/fk_cases.json
          run_case current-provider parsed_model_matches_compiled_mujoco_structure "$ROOT/model.log"
          run_case current-provider fk_matches_upstream_mj_forward "$ROOT/fk.log"
          cp "$ROOT/current-fix312/ik_cases.json" tests/golden/ik_cases.json
          run_case current-default-ik ik_matches_upstream_mink_qp_solve_within_tolerance "$ROOT/ik-current.log"
          cp "$ROOT/legacy-overlap/ik_cases.json" tests/golden/ik_cases.json
          run_case legacy-overlap-ik ik_matches_upstream_mink_qp_solve_within_tolerance "$ROOT/ik-legacy.log"
          cp "$ROOT/historical/"*.json tests/golden/
          git checkout -- tests/golden
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          echo 'EPHEMERAL_RUST_TREE_RESTORED'

      - name: Summarize exact result
        shell: bash
        run: |
          set -euo pipefail
          for f in "$ROOT/model.log" "$ROOT/fk.log" "$ROOT/ik-current.log" "$ROOT/ik-legacy.log"; do
            echo "===== $(basename "$f") ====="
            grep -E 'test result:|FAILED|panicked|actual=|expected=' "$f" | tail -n 30 || true
          done
          echo 'REMOTE_MUTATION=false'
          echo 'PHYSICAL_HARDWARE=false'
          echo 'NUMERICAL_REVALIDATION_EXECUTED=true'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "${ROOT:-}" /tmp/openarm_kin_golden
