name: AI Director hosted outcome probe

on:
  pull_request:
    branches:
      - exp/ai-director-hosted-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create temporary client environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/ai-director-venv"
          "$RUNNER_TEMP/ai-director-venv/bin/pip" install --disable-pip-version-check -q --upgrade gradio_client

      - name: Inspect public LTX generation and repair API schemas
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/ai-director-venv"
          "$VENV/bin/python" - <<'PY'
          import json, urllib.request
          from gradio_client import Client

          spaces = {
              'Lightricks/LTX-2-3': 'https://lightricks-ltx-2-3.hf.space',
              'ltx-community/ltx-2.3-inpaint': 'https://ltx-community-ltx-2-3-inpaint.hf.space',
              'linoyts/LTX-2-3-First-Last-Frame': 'https://linoyts-ltx-2-3-first-last-frame.hf.space',
          }
          for space, host in spaces.items():
              print('\n===SPACE', space, '===')
              for suffix in ('/gradio_api/info', '/info', '/config'):
                  url=host+suffix
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'ai-director-research/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          raw=r.read()
                      print('HTTP_OK', suffix, 'bytes', len(raw), 'content-type', r.headers.get('content-type'))
                      if len(raw) < 200000:
                          text=raw.decode('utf-8','replace')
                          print(text[:120000])
                  except Exception as e:
                      print('HTTP_ERROR', suffix, type(e).__name__, str(e))
              try:
                  c=Client(space, verbose=False)
                  print('CLIENT_SRC', c.src)
                  print('CLIENT_ENDPOINT_COUNT', len(c.endpoints))
                  for idx, ep in sorted(c.endpoints.items()):
                      print('ENDPOINT', idx, 'api_name=', getattr(ep,'api_name',None), 'fn_index=', getattr(ep,'fn_index',None))
                      dep=getattr(ep,'dependency',None)
                      if dep is not None:
                          print('DEPENDENCY', json.dumps(dep, ensure_ascii=False, default=str)[:10000])
                  print('VIEW_API_BEGIN')
                  c.view_api()
                  print('VIEW_API_END')
              except Exception as e:
                  print('CLIENT_ERROR', type(e).__name__, str(e))
          PY
