name: AI Director non-Zero LTX probe

on:
  pull_request:
    branches:
      - exp/ai-director-hosted-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create client environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q --upgrade gradio_client

      - name: Inspect khuramullah non-Zero LTX I2V API
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json
          from gradio_client import Client
          space='khuramullah/LTX2.3-10Eros-image-to-video'
          c=Client(space, verbose=False)
          print('SRC',c.src)
          print('ENDPOINT_COUNT',len(c.endpoints))
          for idx,ep in sorted(c.endpoints.items()):
              print('ENDPOINT',idx,'api_name=',getattr(ep,'api_name',None),'fn_index=',getattr(ep,'fn_index',None))
              dep=getattr(ep,'dependency',None)
              if dep is not None:
                  print('DEPENDENCY',json.dumps(dep,ensure_ascii=False,default=str)[:20000])
          print('VIEW_API_BEGIN')
          c.view_api()
          print('VIEW_API_END')
          PY
