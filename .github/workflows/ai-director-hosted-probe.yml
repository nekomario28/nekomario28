name: AI Director Spotlight metadata discovery

on:
  pull_request:
    branches:
      - exp/ai-director-hosted-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover non-media dataset files
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q --upgrade huggingface_hub
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          from huggingface_hub import HfApi
          api=HfApi()
          files=api.list_repo_files('UBC-ViL/Spotlight-VideoGen-Errors', repo_type='dataset')
          print('TOTAL_FILES',len(files))
          for f in files:
              if not f.lower().endswith(('.mp4','.mov','.webm','.avi','.mkv')):
                  print('NON_MEDIA',f)
          PY
