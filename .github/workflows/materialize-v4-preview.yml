name: Materialize envelope v4 preview

on:
  push:
    branches: [feat/envelope-v4-segmented-refresh]
    paths:
      - ".github/workflows/materialize-v4-preview.yml"
      - "design-lab/scripts/render_envelope_chrome.py"
      - "design-lab/theme-manifest.json"
      - "assets/profile-frame-bridge.svg"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Render Summer v4 stable chrome
        run: python design-lab/scripts/render_envelope_chrome.py --season summer
      - name: Commit exact renderer output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-frame-bridge.svg assets/profile-section-projects.svg assets/profile-section-activity.svg assets/profile-footer.svg
          if git diff --cached --quiet; then
            echo "Preview chrome already matches renderer."
            exit 0
          fi
          git commit -m "materialize envelope v4 Summer preview chrome"
          git push
