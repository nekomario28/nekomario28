name: Envelope v7 render composites once

on:
  pull_request:
    branches: [main]
    paths:
      - "design-lab/envelope-v7/render_panels.py"
      - ".github/workflows/envelope-v7-render-composites-once.yml"

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Render composite panels
        shell: bash
        run: |
          set -euo pipefail
          python design-lab/envelope-v7/render_panels.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ('projects-panel.svg','activity-panel.svg'):
              path = Path('design-lab/envelope-v7') / name
              root = ET.parse(path).getroot()
              assert root.attrib['width'] == '900'
              assert root.attrib['viewBox'].startswith('0 0 900 ')
              text = path.read_text()
              assert '<image ' not in text
              assert text.count('<svg') >= 2
          PY
          git diff --check

      - name: Commit rendered panels when changed
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- design-lab/envelope-v7/projects-panel.svg design-lab/envelope-v7/activity-panel.svg; then
            echo "Composite panels already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-lab/envelope-v7/projects-panel.svg design-lab/envelope-v7/activity-panel.svg
          git commit -m "Render Envelope v7 composite stages"
          git push origin "HEAD:$HEAD_REF"
