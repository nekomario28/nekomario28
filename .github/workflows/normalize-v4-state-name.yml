name: Normalize envelope v4 state name

on:
  push:
    branches: [feat/envelope-v4-segmented-refresh]
    paths: [".github/workflows/normalize-v4-state-name.yml"]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('.github/workflows/update-seasonal-profile.yml'),
              Path('design-lab/scripts/promote-season.py'),
              Path('design-lab/live-theme.json'),
          ]
          changed = False
          for p in paths:
              s = p.read_text()
              s2 = s.replace('segmented-bridge-v2', 'segmented-rails')
              if s2 != s:
                  p.write_text(s2)
                  changed = True
          assert changed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-seasonal-profile.yml design-lab/scripts/promote-season.py design-lab/live-theme.json
          git commit -m "normalize envelope v4 frame mode"
          git push
