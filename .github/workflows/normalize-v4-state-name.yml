name: Normalize envelope v4 state name

on:
  push:
    branches: [feat/envelope-v4-segmented-refresh]
    paths: [".github/workflows/normalize-v4-state-name.yml"]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/update-seasonal-profile.yml')
          s = p.read_text()
          s2 = s.replace("state['frame']['mode'] == 'segmented-rails'", "state['frame']['mode'] == 'segmented-bridge-v2'")
          assert s2 != s
          p.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-seasonal-profile.yml
          git commit -m "align envelope v4 frame mode validation"
          git push
