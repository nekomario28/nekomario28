name: Preview latest project map Action

on:
  push:
    branches: [experiment/project-map-action-consumer]
    paths:
      - ".github/workflows/preview-project-map-action.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-project-map-action-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate with latest reviewed interactive-project-map Action
        uses: nekomario28/interactive-project-map@9307154077613337f29fed4ffe981f4cc73de915
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          theme: dark
          style: galaxy-systems
          max_repos: "100"
          forks: "true"
          archived: "false"
          width: "740"
          height: "420"
          output_dir: comparison/project-map-action

      - name: Validate generated comparison output
        shell: bash
        run: |
          set -euo pipefail
          test -s comparison/project-map-action/galaxy.svg
          test -s comparison/project-map-action/graph.json
          grep -q '<svg' comparison/project-map-action/galaxy.svg
          grep -q '"owner"' comparison/project-map-action/graph.json
          grep -q '"taxonomy"' comparison/project-map-action/graph.json

      - name: Transfer generated comparison output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-map-action-comparison
          path: comparison/project-map-action
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated comparison output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-map-action-comparison
          path: comparison/project-map-action

      - name: Commit comparison output only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- comparison/project-map-action/galaxy.svg comparison/project-map-action/graph.json
          if git diff --cached --quiet; then
            echo "Comparison output is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "generate latest project map action comparison"
          git push
