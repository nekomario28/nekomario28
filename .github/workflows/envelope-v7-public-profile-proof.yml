name: Envelope v7 public profile proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/envelope-v7-public-profile-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install proof-only helpers
        shell: bash
        run: python -m pip install --quiet websocket-client pillow

      - name: Prove persistent public-profile rail playback
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          out="$RUNNER_TEMP/envelope-v7-public-profile-proof"
          mkdir -p "$out/chrome-profile"
          export OUT="$out"

          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --user-data-dir="$out/chrome-profile" \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --window-size=1440,3400 about:blank >"$out/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 80); do
            curl -fsS http://127.0.0.1:9222/json/list >"$out/targets.json" && break
            sleep .2
          done
          if ! test -s "$out/targets.json"; then
            cat "$out/chrome.log" || true
            exit 1
          fi

          python - <<'PY'
          import base64, json, os, time, urllib.request
          from pathlib import Path
          import websocket
          from PIL import Image, ImageChops

          out = Path(os.environ['OUT'])
          targets = json.loads((out / 'targets.json').read_text())
          target = next(t for t in targets if t.get('type') == 'page')
          ws = websocket.create_connection(target['webSocketDebuggerUrl'], timeout=20)
          seq = 0

          def call(method, params=None):
              global seq
              seq += 1
              ident = seq
              ws.send(json.dumps({'id': ident, 'method': method, 'params': params or {}}))
              while True:
                  msg = json.loads(ws.recv())
                  if msg.get('id') == ident:
                      if 'error' in msg:
                          raise RuntimeError(f"CDP {method}: {msg['error']}")
                      return msg.get('result', {})

          def evaluate(expr):
              return call('Runtime.evaluate', {'expression': expr, 'returnByValue': True, 'awaitPromise': True}).get('result', {}).get('value')

          def wait_complete(timeout=20):
              end = time.time() + timeout
              while time.time() < end:
                  state = evaluate("""(() => ({ready: document.readyState, images: Array.from(document.images).every(i => i.complete && i.naturalWidth > 0)}))()""")
                  if state and state.get('ready') == 'complete' and state.get('images'):
                      return
                  time.sleep(.15)
              raise RuntimeError('public profile did not finish loading its images')

          def capture(name, clip):
              data = call('Page.captureScreenshot', {
                  'format': 'png', 'captureBeyondViewport': True,
                  'clip': {**clip, 'scale': 1}
              })['data']
              (out / name).write_bytes(base64.b64decode(data))

          with urllib.request.urlopen('https://api.github.com/repos/nekomario28/nekomario28/commits/main', timeout=15) as response:
              observed_main = json.load(response)['sha']

          call('Page.enable')
          call('Runtime.enable')
          # Match the known-good Envelope v6 proof: only force GitHub dark rendering.
          call('Emulation.setEmulatedMedia', {'features': [{'name': 'prefers-color-scheme', 'value': 'dark'}]})
          call('Emulation.setDeviceMetricsOverride', {'width': 1440, 'height': 3400, 'deviceScaleFactor': 1, 'mobile': False})
          call('Page.navigate', {'url': 'https://github.com/nekomario28'})
          wait_complete()
          time.sleep(1.0)

          media = evaluate("""(() => ({reduce: matchMedia('(prefers-reduced-motion: reduce)').matches, noPreference: matchMedia('(prefers-reduced-motion: no-preference)').matches}))()""")
          bridge = evaluate("""(() => {
            const i = Array.from(document.images).find(x => x.src.includes('profile-frame-bridge-character-projects.svg'));
            if (!i) return null;
            const r = i.getBoundingClientRect();
            return {src:i.src,x:r.x,y:r.y,width:r.width,height:r.height,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight};
          })()""")
          if not bridge:
              raise RuntimeError('Envelope v7 bridge is absent from the actual public profile DOM')
          if bridge['naturalWidth'] != 900 or bridge['naturalHeight'] != 32:
              raise RuntimeError(f'unexpected v7 bridge geometry: {bridge}')

          clip = {'x': bridge['x'], 'y': bridge['y'], 'width': bridge['width'], 'height': bridge['height']}
          interval = 0.25
          duration = 9.0
          count = int(duration / interval) + 1
          names = []
          start = time.monotonic()
          for i in range(count):
              name = f'bridge-{i:02d}.png'
              capture(name, clip)
              names.append(name)
              target_t = start + (i + 1) * interval
              time.sleep(max(0, target_t - time.monotonic()))

          changed_pairs = []
          edge_pairs = []
          max_edge_changed = 0
          for i in range(len(names) - 1):
              a = Image.open(out / names[i]).convert('RGB')
              b = Image.open(out / names[i+1]).convert('RGB')
              diff = ImageChops.difference(a, b)
              changed = sum(1 for px in diff.getdata() if px != (0, 0, 0))
              if not changed:
                  continue
              bbox = diff.getbbox()
              item = {'from': i, 'to': i + 1, 'changed_pixels': changed, 'bbox': bbox}
              changed_pairs.append(item)
              if bbox and (bbox[2] <= 32 or bbox[0] >= a.width - 32):
                  edge_pairs.append(item)
                  max_edge_changed = max(max_edge_changed, changed)

          metrics = {
              'result': 'PASS' if edge_pairs else 'FAIL',
              'observed_main_sha': observed_main,
              'target': 'https://github.com/nekomario28',
              'proof_scope': 'actual public GitHub profile, one persistent Chrome page, v7 character-to-projects bridge',
              'bridge_rect': bridge,
              'media': media,
              'sample_interval_seconds': interval,
              'sample_duration_seconds': duration,
              'sample_count': count,
              'changed_pair_count': len(changed_pairs),
              'edge_localized_pair_count': len(edge_pairs),
              'max_edge_changed_pixels': max_edge_changed,
              'first_edge_pairs': edge_pairs[:8],
              'cross_document_hard_sync_claimed': False,
          }
          print('ENVELOPE_V7_PUBLIC_PLAYBACK ' + json.dumps(metrics, separators=(',', ':')))
          (out / 'metrics.json').write_text(json.dumps(metrics, indent=2))
          if not edge_pairs:
              raise RuntimeError('no edge-localized Envelope v7 bridge motion observed across the persistent-page sample')
          PY

          sha256sum "$out"/bridge-*.png | tail -n 4
