name: Project Map reusable smoke

on:
  push:
    branches:
      - ipm-reusable-smoke
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    permissions:
      contents: read
    uses: nekomario28/interactive-project-map/.github/workflows/generate-project-map.yml@onboarding-reusable-workflow
    with:
      theme: dark
      style: galaxy-systems
      max_repos: "20"
      forks: true
      archived: false

  verify-artifact:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download generated map
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-map-generated
          path: project-map

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s project-map/galaxy.svg
          test -s project-map/graph.json
