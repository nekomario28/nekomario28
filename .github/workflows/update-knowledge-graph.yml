name: Update project knowledge graph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"
      - "config/project-relations.json"
      - "scripts/generate_knowledge_graph.py"
      - "docs/index.html"
      - "docs/graph.js"
      - "docs/styles.css"
  schedule:
    - cron: "41 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-knowledge-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate project graph data and previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_knowledge_graph.py \
            --username nekomario28 \
            --relations config/project-relations.json \
            --json docs/graph-data.json \
            --light assets/knowledge-graph-light.svg \
            --dark assets/knowledge-graph-dark.svg

      - name: Commit updated graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/graph-data.json assets/knowledge-graph-light.svg assets/knowledge-graph-dark.svg

          if git diff --cached --quiet; then
            echo "Project graph is already up to date."
            exit 0
          fi

          git commit -m "update project graph"
          git push
