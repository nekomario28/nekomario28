name: Update project map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"
  schedule:
    # Twice-daily refresh; push/manual triggers handle immediate updates.
    - cron: "41 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-project-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: read
    uses: nekomario28/interactive-project-map/.github/workflows/generate-project-map.yml@v1
    with:
      theme: dark
      style: galaxy-systems
      max_repos: "100"
      forks: true
      archived: false

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-map-generated
          path: project-map

      - name: Validate generated project map
        shell: bash
        run: |
          set -euo pipefail
          test -s project-map/galaxy.svg
          test -s project-map/graph.json
          grep -q 'data-galaxy-preset="systems"' project-map/galaxy.svg
          grep -q 'stroke-width="1.4"' project-map/galaxy.svg
          grep -q '"taxonomy"' project-map/graph.json

      - name: Commit only when the generated map changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- project-map/galaxy.svg project-map/graph.json
          if git diff --cached --quiet; then
            echo "Project map is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update project map"
          git push
