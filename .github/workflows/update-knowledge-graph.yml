name: Update interactive project map

on:
  push:
    branches: [main, galaxy-structure-redesign]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"
      - "config/project-relations.json"
      - "scripts/generate_knowledge_graph.py"
      - "scripts/render_project_map.py"
      - "scripts/enhance_project_map_preview.py"
      - "scripts/validate_project_map.py"
      - "docs/index.html"
      - "docs/graph.js"
      - "docs/obsidian-controls.js"
      - "docs/orbital-spacing.js"
      - "docs/galaxy-structure.js"
      - "docs/cosmic.js"
      - "docs/styles.css"
      - "docs/responsive.css"
  schedule:
    - cron: "41 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interactive-project-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Validate force baseline and galaxy layers
        shell: bash
        run: |
          node --check docs/graph.js
          node --check docs/obsidian-controls.js
          node --check docs/orbital-spacing.js
          node --check docs/galaxy-structure.js
          node --check docs/cosmic.js
          python -m py_compile scripts/render_project_map.py scripts/enhance_project_map_preview.py scripts/validate_project_map.py
          test -s docs/responsive.css
          grep -q 'href="responsive.css"' docs/index.html

          # Force-only baseline remains independently usable.
          grep -q 'center:' docs/graph.js
          grep -q 'repel:' docs/graph.js
          grep -q 'link:' docs/graph.js
          grep -q 'linkDistance:' docs/graph.js
          ! grep -q 'anchorX' docs/graph.js
          ! grep -q 'anchorY' docs/graph.js
          ! grep -q 'fixed: raw.type' docs/graph.js

          # Galaxy mode separates nearby projects in orbital phase, not with
          # last-moment collision snaps or fish-like sidestep steering.
          grep -q 'src="orbital-spacing.js"' docs/index.html
          ! grep -q 'src="natural-motion.js"' docs/index.html
          grep -q 'applyOrbitalSpacing' docs/orbital-spacing.js
          grep -q 'radialGap' docs/orbital-spacing.js
          grep -q 'comfortAngle' docs/orbital-spacing.js
          grep -q 'phasePush' docs/orbital-spacing.js
          ! grep -q '\.x[[:space:]]*[+-]=' docs/orbital-spacing.js
          ! grep -q '\.y[[:space:]]*[+-]=' docs/orbital-spacing.js

          # Redesign contract: one galactic center, differential rotation, categories
          # are semantic sector labels rather than local orbit centers.
          grep -q 'src="galaxy-structure.js"' docs/index.html
          ! grep -q 'src="galaxy-orbits.js"' docs/index.html
          grep -q 'galaxyAngularSpeedForRadius' docs/galaxy-structure.js
          grep -q 'repositoryPlannedRadius' docs/galaxy-structure.js
          grep -q 'positionCategoryAtCentroid' docs/galaxy-structure.js
          grep -q 'node.x - owner.x' docs/galaxy-structure.js
          grep -q 'node.y - owner.y' docs/galaxy-structure.js
          grep -q 'target.targetRadius - radius' docs/galaxy-structure.js
          grep -q 'target.category.armPhase + target.phaseOffset' docs/galaxy-structure.js
          ! grep -q 'target.parent' docs/galaxy-structure.js
          ! grep -q 'applyNaturalAvoidance' docs/galaxy-structure.js

          # Category presentation is an irregular but stable stellar association:
          # logical ellipse envelope, several deterministic lobes, no animated noise
          # or hard visible boundary.
          grep -q 'drawCategoryAssociations' docs/cosmic.js
          grep -q 'associationUnit' docs/cosmic.js
          grep -q 'lobeCount' docs/cosmic.js
          grep -q 'no closed boundary' docs/cosmic.js
          grep -q 'id="stellar-associations"' scripts/enhance_project_map_preview.py

          # Plain mode must remain independent of galaxy presentation.
          grep -q 'plain' docs/galaxy-structure.js
          grep -q 'plain' docs/cosmic.js
          ! grep -q 'applyForces[[:space:]]*=' docs/cosmic.js

          # Offline smoke render catches renderer/enhancer/validator regressions
          # before network-backed repository generation starts.
          tmpdir="$(mktemp -d)"
          python scripts/render_project_map.py \
            --json docs/graph-data.json \
            --light "$tmpdir/light.svg" \
            --dark "$tmpdir/dark.svg"
          python scripts/enhance_project_map_preview.py "$tmpdir/light.svg" "$tmpdir/dark.svg"
          python scripts/validate_project_map.py \
            --json docs/graph-data.json \
            --config config/project-relations.json \
            --html docs/index.html \
            --light "$tmpdir/light.svg" \
            --dark "$tmpdir/dark.svg"
          rm -rf "$tmpdir"

      - name: Generate project map data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_knowledge_graph.py \
            --username nekomario28 \
            --relations config/project-relations.json \
            --json docs/graph-data.json \
            --light assets/project-map-light.svg \
            --dark assets/project-map-dark.svg

      - name: Render project map previews
        run: |
          python scripts/render_project_map.py \
            --json docs/graph-data.json \
            --light assets/project-map-light.svg \
            --dark assets/project-map-dark.svg
          python scripts/enhance_project_map_preview.py \
            assets/project-map-light.svg \
            assets/project-map-dark.svg

      - name: Validate generated project map
        run: |
          python scripts/validate_project_map.py \
            --json docs/graph-data.json \
            --config config/project-relations.json \
            --html docs/index.html \
            --light assets/project-map-light.svg \
            --dark assets/project-map-dark.svg

      - name: Commit updated project map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/graph-data.json assets/project-map-light.svg assets/project-map-dark.svg

          if git diff --cached --quiet; then
            echo "Project map is already up to date."
            exit 0
          fi

          git commit -m "update project map"
          git push
