name: Update project map

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"

permissions:
  contents: read

jobs:
  probe-exact-action-f:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact profile revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate project map with exact taxonomy implementation F
        uses: nekomario28/interactive-project-map@9d018370d7b22d82d8974ae1ac018de5589dd85a
        with:
          github_token: ${{ github.token }}
          username: nekomario28
          theme: dark
          style: galaxy-systems
          max_repos: "100"
          forks: "true"
          archived: "true"
          contributed: "true"
          output_dir: .tmp/project-map-f

      - name: Validate real-profile artifact identity boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s .tmp/project-map-f/graph.json
          node <<'NODE'
          const fs = require('node:fs');
          const graph = JSON.parse(fs.readFileSync('.tmp/project-map-f/graph.json', 'utf8'));
          const repositories = graph.nodes.filter((node) => node?.type === 'repository');
          const lime = repositories.find((node) => String(node.label).toLowerCase() === 'lime_tidyup');
          if (!lime) throw new Error('lime_tidyup missing from exact-F real profile graph');
          const tags = lime.taxonomyAssignment?.secondaryTags ?? [];
          if (lime.taxonomyAssignment?.categoryId !== 'robotics-automation') throw new Error(`unexpected lime category: ${lime.taxonomyAssignment?.categoryId}`);
          if (!tags.includes('artifact:application')) throw new Error(`lime application facet missing: ${JSON.stringify(tags)}`);
          if (tags.includes('artifact:documentation')) throw new Error(`incidental documentation facet survived: ${JSON.stringify(tags)}`);
          if (!tags.includes('ecosystem:ros2')) throw new Error(`ROS2 ecosystem facet missing: ${JSON.stringify(tags)}`);
          if (!tags.includes('topic:gazebo')) throw new Error(`Gazebo topic facet missing: ${JSON.stringify(tags)}`);
          if (repositories.length < 15) throw new Error(`unexpected profile repository count: ${repositories.length}`);
          const contributed = repositories.filter((node) => node?.relation === 'contributed');
          if (contributed.length < 1) throw new Error('accepted Contributed repository disappeared in exact-F probe');
          console.log(`EXACT_ACTION_F_PROFILE_PASS repositories=${repositories.length} lime=${tags.join(',')} contributed=${contributed.length}`);
          NODE

      - name: Prove probe cannot publish
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "pull_request"
          git diff --check
          echo "READ_ONLY_EXACT_F_PROFILE_PROBE_PASS"
