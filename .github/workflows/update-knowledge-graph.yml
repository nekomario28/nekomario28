name: Update project map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"
      - "README.md"
  schedule:
    # Twice-daily refresh; push/manual triggers handle immediate updates.
    - cron: "41 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-project-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: read
    # Reviewed arm-free profile Galaxy v1 release: R 7524a9bf43fbdb5dd88ede5312f858de0e41e70a
    # resolves immutable Action F 041717e17cea8a28343a3b607ef4faf008813fd0 (Verify #822/#827).
    uses: nekomario28/interactive-project-map/.github/workflows/generate-project-map.yml@v1
    with:
      theme: dark
      style: galaxy-systems
      max_repos: "100"
      forks: true
      archived: true
      contributed: true

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact profile revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-map-generated
          path: project-map

      - name: Validate direct IPM profile surface
        shell: bash
        run: |
          set -euo pipefail
          test -s project-map/galaxy.svg
          test -s project-map/graph.json
          grep -q 'src="project-map/galaxy.svg"' README.md
          if grep -Eq 'active-profile-envelope|profile-projects-canvas\.svg|profile-activity-canvas\.svg|profile-(attribution-projects-transition|activity-header|footer-transition)\.svg' README.md; then
            echo 'README still mounts Envelope-derived presentation SVGs.' >&2
            exit 1
          fi
          grep -q 'data-galaxy-preset="systems"' project-map/galaxy.svg
          grep -q '#E69F00' project-map/galaxy.svg
          grep -q 'data-profile-galaxy-background="ead72debca2a16608ebc5b799993c0234ea10cab"' project-map/galaxy.svg
          grep -q 'data-galaxy-external="true"' project-map/galaxy.svg
          grep -q 'data-galaxy-external-layout="halo"' project-map/galaxy.svg
          grep -q 'data-galaxy-orbit="contributed"' project-map/galaxy.svg
          grep -q 'data-galaxy-placement="external-halo-orbit"' project-map/galaxy.svg
          grep -q '>Contributed</text>' project-map/galaxy.svg
          if grep -Eq 'data-galaxy-external-layout="rail"|data-galaxy-external-backdrop="true"|data-galaxy-placement="external-rail"|External contributions' project-map/galaxy.svg; then
            echo 'Detached/legacy Contributed presentation is still present.' >&2
            exit 1
          fi
          grep -q '"taxonomy"' project-map/graph.json
          node <<'NODE'
          const fs = require('node:fs');
          const svg = fs.readFileSync('project-map/galaxy.svg', 'utf8');
          const graph = JSON.parse(fs.readFileSync('project-map/graph.json', 'utf8'));
          const owner = 'nekomario28';
          const donor = 'ead72debca2a16608ebc5b799993c0234ea10cab';
          const groups = graph.nodes.filter((node) => node?.type === 'group');
          const contributed = graph.nodes.filter((node) => node?.type === 'repository' && node?.relation === 'contributed');
          const contributedIds = new Set(contributed.map((node) => node.id));

          if (contributed.length < 1) throw new Error('canonical map has no accepted Contributed repositories');
          if (graph.contributedRepositoryCount !== contributed.length) throw new Error('Contributed count mismatch');
          if (graph.externalContributions?.includedRepositories !== contributed.length) throw new Error('Contributed diagnostics mismatch');
          for (const node of contributed) {
            if (!node.repositoryOwner || !node.repositoryName || String(node.repositoryOwner).toLowerCase() === owner) throw new Error('invalid external repository identity');
            if ('groupId' in node || 'groupLabel' in node) throw new Error('Contributed repository gained owned category membership');
            const commits = Number(node.contribution?.commits || 0);
            const merged = Number(node.contribution?.mergedPullRequests || 0);
            if (commits < 1 && merged < 1) throw new Error(`pending-only repository admitted as Contributed: ${node.label}`);
          }
          if (graph.edges.some((edge) => ['ownership', 'membership'].includes(edge?.type) && contributedIds.has(edge?.target))) throw new Error('ownership path reaches Contributed repository');
          const contributionTargets = new Set(graph.edges.filter((edge) => edge?.type === 'contribution').map((edge) => edge.target));
          for (const id of contributedIds) if (!contributionTargets.has(id)) throw new Error(`missing canonical contribution edge for ${id}`);
          if ((graph.semanticEdges || []).some((edge) => contributedIds.has(edge?.source) || contributedIds.has(edge?.target))) throw new Error('Contributed repository entered owned semantic graph');

          if (!svg.includes(`data-profile-galaxy-background="${donor}"`)) throw new Error('historical background donor marker is missing');
          const rings = [...svg.matchAll(/data-profile-galaxy-ring=/g)].length;
          const arms = [...svg.matchAll(/data-profile-galaxy-arm=/g)].length;
          const associations = [...svg.matchAll(/data-profile-stellar-association=/g)].length;
          if (rings !== 3) throw new Error(`Galaxy ring count mismatch: ${rings}`);
          if (arms !== 0) throw new Error(`historical foreground arms leaked into the background import: ${arms}`);
          if (associations !== groups.length) throw new Error(`stellar association count mismatch: ${associations} SVG vs ${groups.length} groups`);
          if (/parallax|meteor/i.test(svg)) throw new Error('screen-space cosmic decoration leaked into static Galaxy output');

          const haloStart = svg.indexOf('data-galaxy-external-layout="halo"');
          if (haloStart < 0) throw new Error('Galaxy Systems external halo is missing');
          const haloSlice = svg.slice(haloStart);
          const haloPlacements = [...haloSlice.matchAll(/data-galaxy-orbit="contributed" data-galaxy-placement="external-halo-orbit"/g)];
          if (haloPlacements.length !== contributed.length) throw new Error(`external halo placement mismatch: ${haloPlacements.length} SVG vs ${contributed.length} graph`);
          const haloAnimations = [...haloSlice.matchAll(/<animateTransform\b/g)].length;
          if (haloAnimations < contributed.length) throw new Error(`external halo motion mismatch: ${haloAnimations} animations vs ${contributed.length} contributed repositories`);

          const forbiddenKeys = new Set(['private', 'isPrivate', 'restricted', 'isRestricted']);
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKeys.has(key)) throw new Error(`forbidden privacy key serialized: ${key}`);
              visit(child);
            }
          };
          visit(graph);
          console.log(`Direct IPM profile validated: ${graph.repositoryCount} owned + ${contributed.length} Contributed; background-only donor + external halo`);
          NODE

      - name: Verify direct publish diff on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if test -n "$(git status --short -- assets/profile-*.svg design-lab/live-theme.json)"; then
            echo 'Project Map refresh unexpectedly modified retired Envelope derivatives.' >&2
            git status --short -- assets/profile-*.svg design-lab/live-theme.json >&2
            exit 1
          fi
          echo "DIRECT_IPM_PROFILE_REFRESH_PR_PASS"

      - name: Commit project map
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add -- project-map/galaxy.svg project-map/graph.json
          if git diff --cached --quiet; then
            echo "Project map is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update project map"
          git push origin HEAD:main
