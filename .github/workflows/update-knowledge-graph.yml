name: Update interactive project map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"
      - "config/project-relations.json"
      - "scripts/generate_knowledge_graph.py"
      - "scripts/render_project_map.py"
      - "scripts/enhance_project_map_preview.py"
      - "scripts/validate_project_map.py"
      - "project-map/graph-data.json"
  schedule:
    - cron: "41 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interactive-project-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Validate renderer and preview baseline
        shell: bash
        run: |
          python -m py_compile scripts/render_project_map.py scripts/enhance_project_map_preview.py scripts/validate_project_map.py
          grep -q 'id="stellar-associations"' scripts/enhance_project_map_preview.py

          # Offline smoke render catches renderer/enhancer/validator regressions
          # before network-backed repository generation starts.
          tmpdir="$(mktemp -d)"
          python scripts/render_project_map.py \
            --json project-map/graph-data.json \
            --light "$tmpdir/light.svg" \
            --dark "$tmpdir/dark.svg"
          python scripts/enhance_project_map_preview.py "$tmpdir/light.svg" "$tmpdir/dark.svg"
          python scripts/validate_project_map.py \
            --json project-map/graph-data.json \
            --config config/project-relations.json \
            --light "$tmpdir/light.svg" \
            --dark "$tmpdir/dark.svg"
          rm -rf "$tmpdir"

      - name: Generate project map data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_knowledge_graph.py \
            --username nekomario28 \
            --relations config/project-relations.json \
            --json project-map/graph-data.json \
            --light "$RUNNER_TEMP/project-map-light.svg" \
            --dark assets/project-map-dark.svg

      - name: Render project map preview
        run: |
          python scripts/render_project_map.py \
            --json project-map/graph-data.json \
            --light "$RUNNER_TEMP/project-map-light.svg" \
            --dark assets/project-map-dark.svg
          python scripts/enhance_project_map_preview.py \
            "$RUNNER_TEMP/project-map-light.svg" \
            assets/project-map-dark.svg

      - name: Validate generated project map
        run: |
          python scripts/validate_project_map.py \
            --json project-map/graph-data.json \
            --config config/project-relations.json \
            --light "$RUNNER_TEMP/project-map-light.svg" \
            --dark assets/project-map-dark.svg

      - name: Commit updated project map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-map/graph-data.json assets/project-map-dark.svg

          if git diff --cached --quiet; then
            echo "Project map is already up to date."
            exit 0
          fi

          git commit -m "update project map"
          git push
