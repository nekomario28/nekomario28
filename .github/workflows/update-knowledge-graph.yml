name: Update interactive project map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-knowledge-graph.yml"
      - "config/project-relations.json"
      - "scripts/generate_knowledge_graph.py"
      - "scripts/render_project_map.py"
      - "scripts/enhance_project_map_preview.py"
      - "scripts/validate_project_map.py"
      - "docs/index.html"
      - "docs/graph.js"
      - "docs/obsidian-controls.js"
      - "docs/natural-motion.js"
      - "docs/galaxy-orbits.js"
      - "docs/cosmic.js"
      - "docs/styles.css"
      - "docs/responsive.css"
  schedule:
    - cron: "41 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interactive-project-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Validate force baseline and galaxy layers
        shell: bash
        run: |
          node --check docs/graph.js
          node --check docs/obsidian-controls.js
          node --check docs/natural-motion.js
          node --check docs/galaxy-orbits.js
          node --check docs/cosmic.js
          test -s docs/responsive.css
          grep -q 'href="responsive.css"' docs/index.html

          # Force-only baseline: the public Obsidian Graph concepts, without
          # category anchors, owner pinning, or semantic initial geometry.
          grep -q 'center:' docs/graph.js
          grep -q 'repel:' docs/graph.js
          grep -q 'link:' docs/graph.js
          grep -q 'linkDistance:' docs/graph.js
          ! grep -q 'anchorX' docs/graph.js
          ! grep -q 'anchorY' docs/graph.js
          ! grep -q 'groupAnchors' docs/graph.js
          ! grep -q 'repositoryAnchors' docs/graph.js
          ! grep -q 'fixed: raw.type' docs/graph.js
          ! grep -q 'anchorX' docs/obsidian-controls.js
          ! grep -q 'anchorY' docs/obsidian-controls.js

          # Natural motion may steer velocity but must not hard-snap coordinates.
          grep -q 'src="natural-motion.js"' docs/index.html
          grep -q 'applyNaturalAvoidance' docs/natural-motion.js
          grep -q 'lookAheadFrames' docs/natural-motion.js
          ! grep -q 'a.x -=' docs/natural-motion.js
          ! grep -q 'b.x +=' docs/natural-motion.js
          ! grep -q 'a.y -=' docs/natural-motion.js
          ! grep -q 'b.y +=' docs/natural-motion.js

          # Galaxy motion is persistent steering around orbital bands and removable.
          grep -q 'src="graph.js"' docs/index.html
          grep -q 'src="obsidian-controls.js"' docs/index.html
          grep -q 'src="galaxy-orbits.js"' docs/index.html
          grep -q 'src="cosmic.js"' docs/index.html
          grep -q 'plain' docs/galaxy-orbits.js
          grep -q 'plain' docs/cosmic.js
          grep -q 'steerOrbit' docs/galaxy-orbits.js
          grep -q 'targetRadius' docs/galaxy-orbits.js
          grep -q 'applyNaturalAvoidance' docs/galaxy-orbits.js
          grep -q 'galaxyOrbitBaseApplyForces();' docs/galaxy-orbits.js
          grep -q 'galaxyOrbitStep();' docs/galaxy-orbits.js
          ! grep -q 'rotatePoint' docs/galaxy-orbits.js
          ! grep -q 'anchorX' docs/galaxy-orbits.js
          ! grep -q 'anchorY' docs/galaxy-orbits.js
          ! grep -q 'src="galaxy-layout.js"' docs/index.html
          ! grep -q 'src="galaxy-motion.js"' docs/index.html
          ! grep -q 'src="galaxy-controls.js"' docs/index.html
          ! grep -q 'applyForces[[:space:]]*=' docs/cosmic.js

      - name: Generate project map data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_knowledge_graph.py \
            --username nekomario28 \
            --relations config/project-relations.json \
            --json docs/graph-data.json \
            --light assets/project-map-light.svg \
            --dark assets/project-map-dark.svg

      - name: Render project map previews
        run: |
          python scripts/render_project_map.py \
            --json docs/graph-data.json \
            --light assets/project-map-light.svg \
            --dark assets/project-map-dark.svg
          python scripts/enhance_project_map_preview.py \
            assets/project-map-light.svg \
            assets/project-map-dark.svg

      - name: Validate generated project map
        run: |
          python scripts/validate_project_map.py \
            --json docs/graph-data.json \
            --config config/project-relations.json \
            --html docs/index.html \
            --light assets/project-map-light.svg \
            --dark assets/project-map-dark.svg

      - name: Commit updated project map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/graph-data.json assets/project-map-light.svg assets/project-map-dark.svg

          if git diff --cached --quiet; then
            echo "Project map is already up to date."
            exit 0
          fi

          git commit -m "update project map"
          git push
