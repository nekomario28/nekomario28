name: Envelope v6 branch render proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/envelope-v6-render-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture branch README around first global-window handoff
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          url='https://github.com/nekomario28/nekomario28/tree/feat/envelope-v6-global-motion-space'
          out="$RUNNER_TEMP/envelope-v6-render-proof"
          mkdir -p "$out"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=14000 --window-size=1440,3000 --screenshot="$out/profile-desktop-dark-t14.png" "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=15000 --window-size=1440,3000 --screenshot="$out/profile-desktop-dark-t15.png" "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=16000 --window-size=1440,3000 --screenshot="$out/profile-desktop-dark-t16.png" "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=16000 --window-size=430,3000 --screenshot="$out/profile-mobile-dark-t16.png" "$url"
          sha256sum "$out"/*.png | tee "$out/sha256.txt"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envelope-v6-render-proof
          path: ${{ runner.temp }}/envelope-v6-render-proof/*
          if-no-files-found: error
          retention-days: 1
