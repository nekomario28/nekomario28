name: Update profile statistics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Generate light statistics
        uses: cicirello/user-statistician@v1.25.0
        with:
          image-file: assets/github-stats-light.svg
          include-title: false
          colors: light
          show-border: false
          hide-keys: general, languages, private
          category-order: repositories, contributions
          locale: ja
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark statistics
        uses: cicirello/user-statistician@v1.25.0
        with:
          image-file: assets/github-stats-dark.svg
          include-title: false
          colors: dark
          show-border: false
          hide-keys: general, languages, private
          category-order: repositories, contributions
          locale: ja
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-light.svg assets/github-stats-dark.svg

          if git diff --cached --quiet; then
            echo "Statistics are already up to date."
            exit 0
          fi

          git commit -m "update stats"
          git push
