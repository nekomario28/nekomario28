name: Envelope v5 render proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/envelope-v5-render-proof.yml"
      - "assets/profile-hero.svg"
      - "assets/profile-frame-bridge.svg"
      - "assets/profile-section-projects.svg"
      - "assets/profile-section-activity.svg"
      - "assets/profile-footer.svg"
      - "README.md"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture GitHub-rendered Envelope v5
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          url='https://github.com/nekomario28/nekomario28/tree/feat/envelope-v5-continuous-flow#readme'
          out="$RUNNER_TEMP/envelope-v5-proof"
          mkdir -p "$out"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=2000 --window-size=1440,2600 --screenshot="$out/desktop-dark-t2.png" "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=8000 --window-size=1440,2600 --screenshot="$out/desktop-dark-t8.png" "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=8000 --window-size=430,2600 --screenshot="$out/mobile-dark-t8.png" "$url"
          sha256sum "$out"/*.png | tee "$out/sha256.txt"
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envelope-v5-github-render-proof
          path: ${{ runner.temp }}/envelope-v5-proof/*
          if-no-files-found: error
          retention-days: 1
