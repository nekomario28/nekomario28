name: Envelope v5 public profile proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/envelope-v5-public-profile-proof.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture actual public profile at two times
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          url='https://github.com/nekomario28'
          out="$RUNNER_TEMP/envelope-v5-public-profile-proof"
          mkdir -p "$out"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=2000 --window-size=1440,3000 --screenshot="$out/profile-desktop-dark-t2.png" "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=8000 --window-size=1440,3000 --screenshot="$out/profile-desktop-dark-t8.png" "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --virtual-time-budget=8000 --window-size=430,3000 --screenshot="$out/profile-mobile-dark-t8.png" "$url"
          sha256sum "$out"/*.png | tee "$out/sha256.txt"
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envelope-v5-public-profile-proof
          path: ${{ runner.temp }}/envelope-v5-public-profile-proof/*
          if-no-files-found: error
          retention-days: 1
