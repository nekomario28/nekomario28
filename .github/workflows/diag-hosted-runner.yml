name: Diag hosted runner availability

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diag-hosted-runner.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe
        run: echo 'HOSTED_RUNNER_PROBE=PASS'
