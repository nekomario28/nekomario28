<radialGradient id="background" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></radialGradient>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#d0d7de" flood-opacity="0.45"/></filter>
